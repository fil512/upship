<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP SHIP! - Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e8e8e8;
    }

    .game-container {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      gap: 10px;
      padding: 10px;
    }

    /* Header */
    .game-header {
      grid-column: 1 / -1;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px;
    }

    .game-title {
      font-size: 1.5rem;
      color: #c4a35a;
    }

    .game-info {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .game-info-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 15px;
      border-radius: 4px;
    }

    .game-info-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
    }

    .game-info-value {
      font-size: 1rem;
      color: #c4a35a;
    }

    /* Left Sidebar - Resources */
    .sidebar-left {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
    }

    .section-title {
      color: #c4a35a;
      font-size: 0.9rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(196, 163, 90, 0.3);
      padding-bottom: 5px;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-bottom: 8px;
    }

    .resource-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 4px;
      text-align: center;
    }

    .resource-icon {
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .resource-value {
      font-size: 0.85rem;
      font-weight: bold;
      color: #c4a35a;
    }

    .resource-label {
      font-size: 0.6rem;
      color: #888;
      text-transform: uppercase;
    }

    .crew-section {
      margin-bottom: 8px;
    }

    .crew-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-bottom: 3px;
      font-size: 0.8rem;
    }

    .crew-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .crew-count {
      color: #c4a35a;
      font-weight: bold;
    }

    .income-badge {
      font-size: 0.7rem;
      color: #4a9;
      background: rgba(68, 170, 153, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* Main Area - Blueprint */
    .main-area {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .blueprint-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .blueprint {
      background: linear-gradient(135deg, #2a2a4a 0%, #1a1a3a 100%);
      border: 2px solid #c4a35a;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 600px;
    }

    .blueprint-title {
      text-align: center;
      color: #c4a35a;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .slot-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .slot {
      width: 80px;
      height: 80px;
      border: 2px dashed rgba(196, 163, 90, 0.5);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .slot:hover {
      border-color: #c4a35a;
      background: rgba(196, 163, 90, 0.1);
    }

    .slot.filled {
      border-style: solid;
      background: rgba(196, 163, 90, 0.2);
    }

    .slot-icon {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .slot-label {
      font-size: 0.6rem;
      color: #888;
      text-transform: uppercase;
    }

    .slot-type-label {
      text-align: center;
      color: #666;
      font-size: 0.7rem;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    /* Ship Stats */
    .ship-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(196, 163, 90, 0.3);
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #c4a35a;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
    }

    /* Right Sidebar - Cards & Actions */
    .sidebar-right {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Sticky turn controls at top of right sidebar */
    .turn-controls {
      position: sticky;
      top: 0;
      background: rgba(30, 30, 50, 0.95);
      padding: 10px;
      margin: -15px -15px 15px -15px;
      border-bottom: 2px solid #c4a35a;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .turn-controls .action-btn {
      flex: 1;
      font-size: 1rem;
      padding: 12px;
    }

    .hand-section {
      margin-bottom: 15px;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: linear-gradient(135deg, #3a3a5a 0%, #2a2a4a 100%);
      border: 1px solid rgba(196, 163, 90, 0.5);
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card:hover {
      transform: translateX(5px);
      border-color: #c4a35a;
    }

    .card:focus-visible {
      outline: 2px solid #4a9;
      outline-offset: 2px;
    }

    .card-name {
      font-size: 0.85rem;
      color: #e8e8e8;
    }

    .card-type {
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
    }

    .actions-section {
      border-top: 1px solid rgba(196, 163, 90, 0.3);
      padding-top: 15px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-btn {
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .action-btn.primary {
      background: #c4a35a;
      color: #1a1a2e;
    }

    .action-btn.primary:hover {
      background: #d4b36a;
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e8e8e8;
      border: 1px solid rgba(196, 163, 90, 0.5);
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Undo button styles */
    .action-btn.undo {
      background: #6c757d;
      color: white;
    }

    .action-btn.undo:hover:not(:disabled) {
      background: #5a6268;
    }

    .action-btn.undo.has-undos {
      background: #17a2b8;
    }

    .action-btn.undo.has-undos:hover:not(:disabled) {
      background: #138496;
    }

    .undo-count {
      background: #dc3545;
      color: white;
      border-radius: 50%;
      padding: 1px 6px;
      font-size: 0.7rem;
      margin-left: 5px;
      font-weight: bold;
    }

    .action-btn.undo.commit-flash {
      animation: undo-flash 0.5s ease-in-out 2;
    }

    @keyframes undo-flash {
      50% { background: #ffc107; }
    }

    /* Bottom - Log */
    .game-log {
      grid-column: 1 / -1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px 15px;
      max-height: 120px;
      overflow-y: auto;
    }

    .log-entry {
      font-size: 0.8rem;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: #666;
      margin-right: 10px;
    }

    .log-message {
      color: #aaa;
    }

    .log-message.system {
      color: #c4a35a;
    }

    /* Technologies */
    .tech-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tech-item {
      background: rgba(68, 170, 153, 0.2);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tech-icon {
      font-size: 1rem;
    }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 1.2rem;
      color: #888;
    }

    /* Turn indicator */
    .turn-indicator {
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
    }

    .turn-indicator.your-turn {
      background: rgba(68, 170, 153, 0.3);
      color: #4a9;
      animation: pulse 2s infinite;
    }

    .turn-indicator.waiting {
      background: rgba(255, 255, 255, 0.1);
      color: #888;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Players list */
    .players-list {
      margin-bottom: 20px;
    }

    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-bottom: 5px;
    }

    .player-item.current {
      border-left: 3px solid #4a9;
    }

    .player-name {
      font-size: 0.85rem;
    }

    .player-faction {
      font-size: 0.7rem;
      color: #888;
    }

    .player-cash {
      color: #c4a35a;
      font-size: 0.85rem;
    }

    /* Gas display */
    .gas-cubes {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .gas-cube {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }

    .gas-cube.hydrogen {
      background: #e74c3c;
      color: white;
    }

    .gas-cube.helium {
      background: #3498db;
      color: white;
    }

    /* Back button */
    .back-btn {
      background: transparent;
      border: 1px solid rgba(196, 163, 90, 0.5);
      color: #c4a35a;
      padding: 5px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Georgia', serif;
    }

    .back-btn:hover {
      background: rgba(196, 163, 90, 0.1);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid #c4a35a;
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(196, 163, 90, 0.3);
    }

    .modal-title {
      color: #c4a35a;
      font-size: 1.2rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #c4a35a;
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: linear-gradient(135deg, #2a3a5a 0%, #1a2a4a 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(196, 163, 90, 0.5);
      animation: toast-slide-in 0.3s ease-out;
      opacity: 1;
      transition: opacity 0.3s ease-out;
    }

    .toast.fade-out {
      opacity: 0;
    }

    .toast.turn-toast {
      background: linear-gradient(135deg, #2a5a4a 0%, #1a4a3a 100%);
      border-color: #4a9;
    }

    .toast.phase-toast {
      background: linear-gradient(135deg, #4a3a2a 0%, #3a2a1a 100%);
      border-color: #c4a35a;
    }

    @keyframes toast-slide-in {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .upgrade-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(196, 163, 90, 0.3);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upgrade-option:hover {
      background: rgba(196, 163, 90, 0.1);
      border-color: #c4a35a;
    }

    .upgrade-option.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .upgrade-name {
      font-size: 1rem;
      color: #e8e8e8;
      margin-bottom: 5px;
    }

    .upgrade-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }

    .upgrade-stat {
      background: rgba(68, 170, 153, 0.2);
      color: #4a9;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .upgrade-stat.negative {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
    }

    .upgrade-required {
      font-size: 0.7rem;
      color: #888;
      margin-top: 5px;
    }

    .upgrade-required.missing {
      color: #e74c3c;
    }

    .remove-btn {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border: 1px solid #e74c3c;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      margin-top: 10px;
      width: 100%;
    }

    .remove-btn:hover {
      background: rgba(231, 76, 60, 0.4);
    }

    .no-upgrades {
      color: #888;
      text-align: center;
      padding: 20px;
    }

    /* Tech buy buttons */
    .tech-buy-btn {
      flex: 1;
      padding: 4px 8px;
      font-size: 0.7rem;
      border-radius: 4px;
      border: 1px solid #c4a35a;
      background: rgba(196, 163, 90, 0.2);
      color: #c4a35a;
      cursor: pointer;
      font-family: 'Georgia', serif;
    }

    .tech-buy-btn:hover:not(:disabled) {
      background: rgba(196, 163, 90, 0.4);
    }

    .tech-buy-btn.research {
      border-color: #4a9;
      background: rgba(68, 170, 153, 0.2);
      color: #4a9;
    }

    .tech-buy-btn.research:hover:not(:disabled) {
      background: rgba(68, 170, 153, 0.4);
    }

    .tech-buy-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Gas sockets */
    .gas-sockets-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }

    .gas-socket {
      width: 40px;
      height: 40px;
      border: 2px dashed rgba(196, 163, 90, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .gas-socket:hover {
      border-color: #c4a35a;
      background: rgba(196, 163, 90, 0.1);
    }

    .gas-socket.hydrogen {
      background: rgba(231, 76, 60, 0.3);
      border-color: #e74c3c;
      border-style: solid;
    }

    .gas-socket.helium {
      background: rgba(52, 152, 219, 0.3);
      border-color: #3498db;
      border-style: solid;
    }

    /* Map section */
    .map-container {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .map-routes {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .route-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .route-item.claimed {
      opacity: 0.6;
    }

    .route-item.claimed-by-me {
      background: rgba(68, 170, 153, 0.2);
      border: 1px solid #4a9;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .route-cities {
      color: #e8e8e8;
    }

    .route-stats {
      display: flex;
      gap: 8px;
    }

    .route-stat {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(196, 163, 90, 0.2);
      color: #c4a35a;
    }

    .claim-btn {
      padding: 4px 8px;
      font-size: 0.7rem;
      border-radius: 4px;
      border: 1px solid #4a9;
      background: rgba(68, 170, 153, 0.2);
      color: #4a9;
      cursor: pointer;
    }

    .claim-btn:hover:not(:disabled) {
      background: rgba(68, 170, 153, 0.4);
    }

    .claim-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Launched ships */
    .launched-ships {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .launched-ship {
      background: rgba(68, 170, 153, 0.2);
      border: 1px solid #4a9;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .launched-ship:hover {
      background: rgba(68, 170, 153, 0.4);
    }

    /* Slot with upgrade */
    .slot.filled .slot-icon {
      font-size: 1.2rem;
    }

    .slot.filled .slot-label {
      font-size: 0.55rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70px;
    }

    /* Physics indicator */
    .physics-check {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
    }

    .physics-item {
      text-align: center;
    }

    .physics-value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .physics-value.ok {
      color: #4a9;
    }

    .physics-value.warning {
      color: #e74c3c;
    }

    .physics-label {
      font-size: 0.7rem;
      color: #888;
    }

    /* Ground Board Section */
    .ground-board-section {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(196, 163, 90, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .locations-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .location {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(196, 163, 90, 0.3);
      border-radius: 4px;
      padding: 8px;
      text-align: center;
      cursor: default;
      transition: all 0.2s;
    }

    .location.available {
      border-color: #4a9;
      cursor: pointer;
    }

    .location.available:hover {
      background: rgba(68, 170, 153, 0.2);
      transform: scale(1.02);
    }

    /* Pulsing animation for matching locations when card is selected */
    .location.available.matching {
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 5px rgba(68, 170, 153, 0.4); }
      50% { box-shadow: 0 0 15px rgba(68, 170, 153, 0.8), 0 0 25px rgba(68, 170, 153, 0.4); }
    }

    /* Symbol-specific colors for matching locations */
    .location.available.symbol-wrench {
      border-color: #6af;
      animation: pulse-wrench 1.5s ease-in-out infinite;
    }

    .location.available.symbol-coin {
      border-color: #c4a35a;
      animation: pulse-coin 1.5s ease-in-out infinite;
    }

    .location.available.symbol-propeller {
      border-color: #4a9;
      animation: pulse-propeller 1.5s ease-in-out infinite;
    }

    @keyframes pulse-wrench {
      0%, 100% { box-shadow: 0 0 5px rgba(102, 170, 255, 0.4); }
      50% { box-shadow: 0 0 15px rgba(102, 170, 255, 0.8), 0 0 25px rgba(102, 170, 255, 0.4); }
    }

    @keyframes pulse-coin {
      0%, 100% { box-shadow: 0 0 5px rgba(196, 163, 90, 0.4); }
      50% { box-shadow: 0 0 15px rgba(196, 163, 90, 0.8), 0 0 25px rgba(196, 163, 90, 0.4); }
    }

    @keyframes pulse-propeller {
      0%, 100% { box-shadow: 0 0 5px rgba(68, 170, 153, 0.4); }
      50% { box-shadow: 0 0 15px rgba(68, 170, 153, 0.8), 0 0 25px rgba(68, 170, 153, 0.4); }
    }

    .location:focus-visible {
      outline: 2px solid #4a9;
      outline-offset: 2px;
    }

    .location.occupied {
      opacity: 0.6;
    }

    .location.location-disabled {
      opacity: 0.5;
      border-color: #dc3545;
      background: rgba(220, 53, 69, 0.1);
      cursor: not-allowed;
    }

    .location-symbol {
      font-size: 1.5rem;
    }

    .location-name {
      font-size: 0.7rem;
      color: #888;
      margin-top: 4px;
    }

    .location-occupant {
      font-size: 1rem;
      margin-top: 4px;
    }

    /* Card selection styles */
    .card.selected {
      border: 2px solid #4a9;
      box-shadow: 0 0 10px rgba(68, 170, 153, 0.5);
    }

    .card.playable {
      cursor: pointer;
    }

    .card.playable:hover {
      transform: translateY(-3px);
      border-color: #c4a35a;
    }

    /* Phase info box */
    .phase-info {
      background: rgba(196, 163, 90, 0.1);
      border: 1px solid rgba(196, 163, 90, 0.3);
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #c4a35a;
    }

    /* Placement indicator styling */
    .placement-indicator,
    .passed-count {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-container" id="game-container">
    <div class="loading">Loading game...</div>
  </div>
  <div id="modal-container"></div>
  <div id="toast-container" class="toast-container"></div>

  <script>
    // Get game ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('id');

    let gameState = null;
    let currentUserId = null;
    let currentUsername = null;
    let actualUserId = null; // The real logged-in user (for dev mode switching)
    let refreshInterval = null;
    let upgradesData = null;
    let selectedCardIndex = null; // For worker placement card selection
    let isDevMode = false; // Dev mode enables player switching

    // State tracking for notifications
    let wasMyTurn = false;
    let previousPhase = null;

    // Undo state tracking
    let undoInfo = { canUndo: false, undoCount: 0, lastActionType: null };

    // Toast notification system
    function showToast(message, type = 'default', duration = 3000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}-toast`;
      toast.textContent = message;
      container.appendChild(toast);

      // Start fade out before removal
      setTimeout(() => {
        toast.classList.add('fade-out');
      }, duration - 300);

      // Remove after duration
      setTimeout(() => {
        toast.remove();
      }, duration);
    }

    function checkAndShowNotifications(state, isMyTurn) {
      // Turn notification - show when it becomes player's turn
      if (isMyTurn && !wasMyTurn) {
        showToast('⚡ It\'s Your Turn!', 'turn');
      }
      wasMyTurn = isMyTurn;

      // Phase notification - show when phase changes
      if (previousPhase !== null && previousPhase !== state.phase) {
        const phaseNames = {
          'worker_placement': '📋 Worker Placement Phase',
          'reveal': '🔍 Reveal Phase',
          'income_cleanup': '💰 Income & Cleanup Phase'
        };
        const phaseName = phaseNames[state.phase] || state.phase;
        showToast(phaseName, 'phase');
      }
      previousPhase = state.phase;
    }

    // Upgrade definitions (loaded from server)
    const SLOT_ICONS = {
      frame: '🔩',
      fabric: '🎨',
      drive: '⚙️',
      component: '📦'
    };

    const SLOT_NAMES = {
      frame: 'Frame',
      fabric: 'Fabric',
      drive: 'Drive',
      component: 'Component'
    };

    const STAT_NAMES = {
      speed: 'Speed',
      range: 'Range',
      ceiling: 'Ceiling',
      reliability: 'Reliability',
      luxury: 'Luxury',
      income: 'Income'
    };

    // Age baseline stats
    const AGE_BASELINES = {
      1: { speed: 1, range: 1, ceiling: 0, reliability: 0 },
      2: { speed: 2, range: 2, ceiling: 1, reliability: 1 },
      3: { speed: 3, range: 3, ceiling: 2, reliability: 2 }
    };

    // Ground Board locations for worker placement (must match server IDs with underscores)
    const GROUND_BOARD_LOCATIONS = {
      'research_institute': {
        name: 'Research Institute', symbol: 'propeller',
        description: 'Expand research program',
        tooltip: '⚙️ Propeller card required\n━━━━━━━━━━━━━━━━━━━━\nPay £2 to increase your Research Level by 1.\nHigher research = access to better technologies.'
      },
      'design_bureau': {
        name: 'Design Bureau', symbol: 'wrench',
        description: 'Install upgrade to blueprint',
        tooltip: '🔧 Wrench card required\n━━━━━━━━━━━━━━━━━━━━\nInstall an upgrade tile from your owned technologies\ninto an empty slot on your blueprint.'
      },
      'construction_hall': {
        name: 'Construction Hall', symbol: 'wrench',
        description: 'Build ships',
        tooltip: '🔧 Wrench card required\n━━━━━━━━━━━━━━━━━━━━\nBuild a ship from your current blueprint.\nShip goes to your hangar ready for launch.'
      },
      'launchpad': {
        name: 'Launchpad', symbol: 'propeller',
        description: 'Launch ships',
        tooltip: '⚙️ Propeller card required\n━━━━━━━━━━━━━━━━━━━━\nLaunch ships from your hangar. Requires:\n• Lift ≥ Weight (load gas cubes)\n• Officers available (1 per ship)'
      },
      'academy': {
        name: 'Academy', symbol: 'coin',
        description: 'Recruit Officers/Engineers',
        tooltip: '🪙 Coin card required\n━━━━━━━━━━━━━━━━━━━━\nRecruit crew members:\n• Officers: £2 each (needed to launch)\n• Engineers: £4 each (repair hazards)'
      },
      'flight_school': {
        name: 'Flight School', symbol: 'coin',
        description: 'Upgrade Officer income',
        tooltip: '🪙 Coin card required\n━━━━━━━━━━━━━━━━━━━━\nPay £3 to increase Officer income by 1.\nGain more Officers each turn during cleanup.'
      },
      'technical_institute': {
        name: 'Technical Institute', symbol: 'coin',
        description: 'Upgrade Engineer income',
        tooltip: '🪙 Coin card required\n━━━━━━━━━━━━━━━━━━━━\nPay £5 to increase Engineer income by 1.\nGain more Engineers each turn during cleanup.'
      },
      'the_bank': {
        name: 'The Bank', symbol: 'coin',
        description: 'Take loans',
        tooltip: '🪙 Coin card required\n━━━━━━━━━━━━━━━━━━━━\nTake £5 loans from the bank.\n⚠️ Loans must be repaid with interest!'
      },
      'ministry': {
        name: 'Ministry', symbol: 'propeller',
        description: 'Draw 2/discard 1, turn priority',
        tooltip: '⚙️ Propeller card required\n━━━━━━━━━━━━━━━━━━━━\nDraw 2 cards, keep 1, discard the other.\nGain first player marker for next turn.'
      },
      'gas_depot': {
        name: 'Gas Depot', symbol: 'propeller',
        description: 'Buy gas cubes',
        tooltip: '⚙️ Propeller card required\n━━━━━━━━━━━━━━━━━━━━\nBuy gas from the market:\n• Hydrogen: £1/cube\n• Helium: £3/cube (safer)'
      },
      'insurance_bureau': {
        name: 'Insurance Bureau', symbol: 'coin',
        description: 'Buy insurance',
        tooltip: '🪙 Coin card required\n━━━━━━━━━━━━━━━━━━━━\nBuy insurance tokens to protect ships.\nPays out if ship is destroyed by hazard.'
      },
      'weather_bureau': {
        name: 'Weather Bureau', symbol: 'propeller',
        description: 'Peek at hazard for £2',
        tooltip: '⚙️ Propeller card required\n━━━━━━━━━━━━━━━━━━━━\nPay £2 to peek at the top hazard card.\nKnow what dangers await before launching!'
      }
    };

    // Initialize
    async function init() {
      if (!gameId) {
        window.location.href = '/';
        return;
      }

      // Check if we're in dev mode
      try {
        const envRes = await fetch('/api/env');
        if (envRes.ok) {
          const envData = await envRes.json();
          isDevMode = envData.isDev;
        }
      } catch (err) {
        // Default to non-dev mode if env check fails
        isDevMode = false;
      }

      // Check auth and get user ID
      try {
        const authRes = await fetch('/api/auth/me');
        if (!authRes.ok) {
          window.location.href = '/';
          return;
        }
        const authData = await authRes.json();
        currentUserId = authData.user.id;
        currentUsername = authData.user.username;
        actualUserId = authData.user.id; // Store the real user ID
      } catch (err) {
        window.location.href = '/';
        return;
      }

      // Load upgrades data
      await loadUpgrades();

      await loadGameState();

      // Refresh state every 5 seconds
      refreshInterval = setInterval(loadGameState, 5000);
    }

    // Load upgrades data
    async function loadUpgrades() {
      try {
        const res = await fetch(`/api/state/${gameId}/upgrades`);
        if (res.ok) {
          upgradesData = await res.json();
        }
      } catch (err) {
        console.error('Failed to load upgrades:', err);
      }
    }

    // Load game state
    async function loadGameState() {
      try {
        // In dev mode, request full unfiltered state for player switching
        const devModeParam = isDevMode ? '?devMode=true' : '';
        const res = await fetch(`/api/state/${gameId}${devModeParam}`);
        if (!res.ok) {
          if (res.status === 404) {
            // Game state not initialized - maybe game hasn't started
            window.location.href = '/?game=' + gameId;
            return;
          }
          throw new Error('Failed to load game state');
        }

        const data = await res.json();
        gameState = data.gameState;

        // Fetch undo info for UI
        await fetchUndoInfo();

        renderGame();
      } catch (err) {
        console.error('Load game state error:', err);
        document.getElementById('game-container').innerHTML =
          '<div class="loading">Failed to load game. <a href="/" style="color: #c4a35a;">Return to lobby</a></div>';
      }
    }

    // Render the game
    function renderGame() {
      if (!gameState || !gameState.state) return;

      const state = gameState.state;
      const myState = state.players[currentUserId];
      // During worker placement, use placementOrder; otherwise use playerOrder
      const isMyTurn = state.phase === 'worker_placement' && state.workerPlacement
        ? state.workerPlacement.placementOrder[state.workerPlacement.currentPlacerIndex] === currentUserId
        : state.playerOrder[state.currentPlayerIndex] === currentUserId;

      // Check for turn/phase changes and show notifications
      checkAndShowNotifications(state, isMyTurn);

      document.getElementById('game-container').innerHTML = `
        <!-- Header -->
        <div class="game-header">
          <div style="display: flex; align-items: center; gap: 20px;">
            <button class="back-btn" data-testid="back-to-lobby" onclick="goBack()">← Lobby</button>
            <span class="game-title">UP SHIP!</span>
          </div>
          <div class="game-info">
            <div class="game-info-item">
              <div class="game-info-label">Age</div>
              <div class="game-info-value">${state.age}</div>
            </div>
            <div class="game-info-item">
              <div class="game-info-label">Turn</div>
              <div class="game-info-value">${state.turn}</div>
            </div>
            <div class="game-info-item">
              <div class="game-info-label">Phase</div>
              <div class="game-info-value">${formatPhase(state.phase)}</div>
            </div>
            ${state.phase === 'worker_placement' && state.workerPlacement ? `
              <div class="game-info-item placement-indicator">
                <div class="game-info-label">Current Placer</div>
                <div class="game-info-value">${getFactionFlag(getCurrentPlacerFaction(state))} ${getCurrentPlacerFaction(state) || '—'}</div>
              </div>
              <div class="game-info-item passed-count">
                <div class="game-info-label">Passed</div>
                <div class="game-info-value">${(state.workerPlacement.passedPlayers || []).length}/${state.playerOrder.length}</div>
              </div>
            ` : ''}
            <div class="turn-indicator ${isMyTurn ? 'your-turn' : 'waiting'}">
              ${isMyTurn ? '⚡ Your Turn' : '⏳ Waiting...'}
            </div>
            ${isDevMode ? `
              <div style="display: flex; align-items: center; gap: 8px; background: rgba(255, 165, 0, 0.2); padding: 5px 10px; border-radius: 4px; border: 1px solid orange;">
                <span style="color: orange; font-size: 0.7rem;">DEV</span>
                <select data-testid="dev-player-select" onchange="switchPlayer(this.value)" style="background: #1a1a2e; color: #e8e8e8; border: 1px solid #c4a35a; border-radius: 4px; padding: 3px 8px; font-family: Georgia, serif; font-size: 0.85rem;">
                  ${state.playerOrder.map(pid => {
                    const player = state.players[pid];
                    const isSelected = pid === currentUserId;
                    return `<option value="${pid}" ${isSelected ? 'selected' : ''}>${getFactionFlag(player.faction)} ${player.faction}</option>`;
                  }).join('')}
                </select>
              </div>
            ` : `
              <div style="color: #aaa; font-size: 0.85rem;">
                👤 ${currentUsername}
              </div>
            `}
          </div>
        </div>

        <!-- Left Sidebar - Resources -->
        <div class="sidebar-left">
          <div class="section-title">Resources</div>
          <div class="resource-grid">
            <div class="resource-item">
              <div class="resource-icon">💰</div>
              <div class="resource-value">£${myState.cash}</div>
              <div class="resource-label">Cash</div>
            </div>
            <div class="resource-item">
              <div class="resource-icon">📈</div>
              <div class="resource-value">£${myState.income}/rnd</div>
              <div class="resource-label">Income</div>
            </div>
            <div class="resource-item">
              <div class="resource-icon">🕵️</div>
              <div class="resource-value">${myState.agentsRemaining ?? myState.agents ?? 3}/${myState.agentsTotal ?? 3}</div>
              <div class="resource-label">Agents</div>
            </div>
            <div class="resource-item">
              <div class="resource-icon">🔬</div>
              <div class="resource-value">${myState.research || 0}</div>
              <div class="resource-label">Research</div>
            </div>
            <div class="resource-item">
              <div class="resource-icon">⭐</div>
              <div class="resource-value">${myState.influence || 0}</div>
              <div class="resource-label">Influence</div>
            </div>
            <div class="resource-item">
              <div class="resource-icon">📊</div>
              <div class="resource-value">${state.progressTrack || 0}</div>
              <div class="resource-label">Progress</div>
            </div>
          </div>
          ${myState.loans ? `
            <div style="background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; border-radius: 4px; padding: 8px; margin-bottom: 10px; text-align: center;">
              <span style="color: #e74c3c; font-size: 0.8rem;">🏦 ${myState.loans} Loan(s) Taken</span>
            </div>
          ` : ''}

          <div class="section-title">Crew</div>
          <div class="crew-section">
            <div class="crew-item">
              <div class="crew-name">
                <span>🧑‍✈️</span>
                <span>Officers</span>
              </div>
              <div>
                <span class="crew-count">${myState.officers}</span>
                <span class="income-badge">+${myState.officerIncome}/turn</span>
              </div>
            </div>
            <div class="crew-item">
              <div class="crew-name">
                <span>🔧</span>
                <span>Engineers</span>
              </div>
              <div>
                <span class="crew-count">${myState.engineers}</span>
                <span class="income-badge">+${myState.engineerIncome}/turn</span>
              </div>
            </div>
          </div>

          <div class="section-title">Gas Reserve</div>
          <div class="gas-cubes">
            ${Array(myState.gasCubes.hydrogen).fill('<div class="gas-cube hydrogen">H</div>').join('')}
            ${Array(myState.gasCubes.helium).fill('<div class="gas-cube helium">He</div>').join('')}
            ${myState.gasCubes.hydrogen + myState.gasCubes.helium === 0 ? '<span style="color: #666; font-size: 0.8rem;">Empty</span>' : ''}
          </div>
          <div style="margin-top: 10px; font-size: 0.75rem; color: #888;">
            Market: H₂ £${state.gasMarket.hydrogen}/cube | He £${state.gasMarket.helium}/cube
          </div>

          <div class="section-title" style="margin-top: 20px;">Fleet Status</div>
          <div style="margin-bottom: 10px;">
            <div style="font-size: 0.75rem; color: #888; margin-bottom: 5px;">Hangar:</div>
            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
              ${(myState.ships || []).filter(s => s.status === 'hangar').length > 0 ?
                (myState.ships || []).filter(s => s.status === 'hangar').map(() =>
                  '<span style="font-size: 1.2rem;">🚀</span>'
                ).join('') :
                '<span style="color: #666; font-size: 0.75rem;">Empty</span>'
              }
            </div>
          </div>
          ${(myState.ships || []).filter(s => s.status === 'awaiting_hazard' && s.pendingHazard).length > 0 ? `
            <div style="margin-bottom: 10px;">
              <div style="font-size: 0.75rem; color: #f96; margin-bottom: 5px; font-weight: bold;">⚠️ Awaiting Hazard Response:</div>
              ${(myState.ships || []).filter(s => s.status === 'awaiting_hazard' && s.pendingHazard).map(ship => {
                const hazard = ship.pendingHazard;
                const route = state.map?.routes?.find(r => r.id === ship.pendingRouteId);
                const isAutoPass = hazard.autoPass || hazard.heliumFireImmunity || hazard.conductiveCoveringImmunity || hazard.fireResistantFabricAvailable;
                const canAffordEngineers = (myState.engineers || 0) >= (hazard.engineersNeeded || hazard.engineerCost || 0);
                return `
                  <div style="padding: 10px; background: rgba(255, 153, 102, 0.2); border: 2px solid #f96; border-radius: 6px; margin-bottom: 5px;">
                    <div style="font-weight: bold; margin-bottom: 5px;">${hazard.name}</div>
                    <div style="font-size: 0.75rem; color: #ccc; margin-bottom: 8px;">
                      Route: ${route ? route.from + ' → ' + route.to : 'Unknown'}
                    </div>
                    ${hazard.autoPassReason ? `
                      <div style="color: #4a9; margin-bottom: 8px;">${hazard.autoPassReason}</div>
                      <button class="tech-buy-btn research" onclick="respondToHazard('${ship.id}', true)" ${!isMyTurn ? 'disabled' : ''}>
                        ✓ Continue
                      </button>
                    ` : hazard.noSave ? `
                      <div style="color: #f66; margin-bottom: 8px;">No save possible!</div>
                      <button class="tech-buy-btn danger" onclick="respondToHazard('${ship.id}', false)" ${!isMyTurn ? 'disabled' : ''}>
                        Accept Fate
                      </button>
                    ` : hazard.engineerCost !== undefined ? `
                      <div style="font-size: 0.8rem; margin-bottom: 5px;">
                        <span style="color: #f96;">Fire Hazard:</span> Spend ${hazard.engineerCost} Engineer(s) to control fire
                      </div>
                      <div style="font-size: 0.75rem; color: #888; margin-bottom: 8px;">
                        Your Engineers: ${myState.engineers || 0} | Result if controlled: Ship Damaged
                      </div>
                      <div style="display: flex; gap: 5px;">
                        <button class="tech-buy-btn research" onclick="respondToHazard('${ship.id}', true)"
                          ${!isMyTurn || !canAffordEngineers ? 'disabled' : ''}>
                          Spend ${hazard.engineerCost} Engineers
                        </button>
                        <button class="tech-buy-btn danger" onclick="respondToHazard('${ship.id}', false)" ${!isMyTurn ? 'disabled' : ''}>
                          Let It Crash
                        </button>
                      </div>
                    ` : `
                      <div style="font-size: 0.8rem; margin-bottom: 5px;">
                        <span style="color: #f96;">${hazard.statName?.toUpperCase() || 'CHECK'} ${hazard.difficulty}:</span>
                        Your stat: ${hazard.relevantStat}
                        ${hazard.engineersNeeded > 0 ? ` (need ${hazard.engineersNeeded} engineers)` : ' ✓'}
                      </div>
                      <div style="font-size: 0.75rem; color: #888; margin-bottom: 8px;">
                        Your Engineers: ${myState.engineers || 0}
                      </div>
                      ${hazard.engineersNeeded === 0 ? `
                        <button class="tech-buy-btn research" onclick="respondToHazard('${ship.id}', true)" ${!isMyTurn ? 'disabled' : ''}>
                          ✓ Pass Check
                        </button>
                      ` : `
                        <div style="display: flex; gap: 5px;">
                          <button class="tech-buy-btn research" onclick="respondToHazard('${ship.id}', true)"
                            ${!isMyTurn || !canAffordEngineers ? 'disabled' : ''}>
                            Spend ${hazard.engineersNeeded} Engineers
                          </button>
                          <button class="tech-buy-btn danger" onclick="respondToHazard('${ship.id}', false)" ${!isMyTurn ? 'disabled' : ''}>
                            Abort Launch
                          </button>
                        </div>
                      `}
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}
          <div style="margin-bottom: 10px;">
            <div style="font-size: 0.75rem; color: #888; margin-bottom: 5px;">On Routes:</div>
            ${(myState.ships || []).filter(s => s.status === 'on_route').length > 0 ?
              (myState.ships || []).filter(s => s.status === 'on_route').map(ship => {
                const route = state.map?.routes?.find(r => r.id === ship.routeId);
                return `
                  <div style="padding: 5px; background: rgba(68, 170, 153, 0.2); border-radius: 4px; margin-bottom: 3px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center;">
                    <span>✈️ ${route ? route.from + ' → ' + route.to : 'Unknown'}</span>
                    <button class="tech-buy-btn research" onclick="performHazardCheck('${ship.id}')" ${!isMyTurn ? 'disabled' : ''} style="font-size: 0.65rem; padding: 2px 5px;">
                      ⚠️ Check
                    </button>
                  </div>
                `;
              }).join('') :
              '<span style="color: #666; font-size: 0.75rem;">None</span>'

    // Helper functions
    function getFactionFlag(faction) {
      const flags = { germany: '🇩🇪', britain: '🇬🇧', usa: '🇺🇸', italy: '🇮🇹' };
      return flags[faction] || '🏳️';
    }

    function getFactionName(faction) {
      const names = { germany: 'Germany', britain: 'Britain', usa: 'United States', italy: 'Italy' };
      return names[faction] || faction;
    }

    function formatPhase(phase) {
      const names = {
        worker_placement: 'Worker Placement',
        reveal: 'Reveal & Acquisition',
        income_cleanup: 'Income & Cleanup',
        age_transition_design_bureau: 'Age Transition - Free Blueprint Upgrade',
        // Legacy phases
        planning: 'Planning',
        actions: 'Actions',
        launch: 'Launch',
        income: 'Income',
        cleanup: 'Cleanup'
      };
      return names[phase] || phase;
    }

    function getCurrentPlacerFaction(state) {
      if (state.phase !== 'worker_placement' || !state.workerPlacement) return null;
      const order = state.workerPlacement.placementOrder || [];
      const index = state.workerPlacement.currentPlacerIndex || 0;
      const playerId = order[index];
      return state.players[playerId]?.faction;
    }

    function formatTechName(tech) {
      return tech.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    function getSymbolIcon(symbol) {
      const icons = {
        wrench: '🔧',
        coin: '🪙',
        propeller: '⚙️',
        any: '⭐'
      };
      return icons[symbol] || '📋';
    }

    function calculateStat(playerState, stat) {
      const age = gameState?.state?.age || 1;
      const baseline = AGE_BASELINES[age];

      // Start with baseline + faction bonus
      let value = (baseline[stat] || 0) + (playerState.bonuses?.[stat] || 0);

      // Add stats from installed upgrades
      if (upgradesData?.allUpgrades && playerState.blueprint) {
        const slots = ['frameSlots', 'fabricSlots', 'driveSlots', 'componentSlots'];
        for (const slotKey of slots) {
          const slotArray = playerState.blueprint[slotKey] || [];
          for (const upgradeId of slotArray) {
            if (!upgradeId) continue;
            const upgrade = upgradesData.allUpgrades[upgradeId];
            if (upgrade?.stats?.[stat]) {
              value += upgrade.stats[stat];
            }
          }
        }
      }

      return value;
    }

    // Calculate total weight from upgrades
    function calculateWeight(playerState) {
      let weight = 0;
      if (upgradesData?.allUpgrades && playerState.blueprint) {
        const slots = ['frameSlots', 'fabricSlots', 'driveSlots', 'componentSlots'];
        for (const slotKey of slots) {
          const slotArray = playerState.blueprint[slotKey] || [];
          for (const upgradeId of slotArray) {
            if (!upgradeId) continue;
            const upgrade = upgradesData.allUpgrades[upgradeId];
            if (upgrade?.weight) {
              weight += Math.abs(upgrade.weight);
            }
          }
        }
      }
      return weight;
    }

    // Calculate lift from gas cubes
    function calculateLift(playerState) {
      let lift = 0;
      const gasSockets = playerState.blueprint?.gasSockets || [];
      for (const cube of gasSockets) {
        if (cube === 'hydrogen' || cube === 'helium') {
          lift += 5;
        }
      }
      return lift;
    }

    // Get upgrade name from ID
    function getUpgradeName(upgradeId) {
      if (!upgradeId) return 'Empty';
      if (upgradesData?.allUpgrades?.[upgradeId]) {
        return upgradesData.allUpgrades[upgradeId].name;
      }
      return formatTechName(upgradeId);
    }

    // Action functions
    async function performAction(actionType, actionData = {}) {
      try {
        // In dev mode, send currentUserId as asUserId to allow player impersonation
        const requestBody = { actionType, actionData };
        if (isDevMode) {
          requestBody.asUserId = currentUserId;
        }

        const res = await fetch(`/api/state/${gameId}/action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Action failed');
          return;
        }

        gameState = data.gameState;

        // Check for commit point notification
        if (data.isCommitPoint) {
          showToast('Checkpoint reached - previous actions locked', 'info');
        }

        // Refresh undo info after action
        await fetchUndoInfo();

        renderGame();
      } catch (err) {
        console.error('Action error:', err);
        alert('Failed to perform action');
      }
    }

    function endTurn() {
      performAction('END_TURN');
    }

    function passAction() {
      // During worker placement, PASS means REVEAL (exit worker placement)
      performAction('REVEAL', {});
    }

    // Undo functionality
    async function fetchUndoInfo() {
      if (!gameId) return;
      try {
        const res = await fetch(`/api/state/${gameId}/undo-info`, { credentials: 'include' });
        if (res.ok) {
          undoInfo = await res.json();
        }
      } catch (err) {
        console.error('Error fetching undo info:', err);
      }
    }

    async function handleUndo() {
      if (!undoInfo.canUndo) {
        showToast('No actions to undo', 'warning');
        return;
      }

      try {
        const requestBody = { actionType: 'UNDO', actionData: {} };
        if (isDevMode) {
          requestBody.asUserId = currentUserId;
        }

        const res = await fetch(`/api/state/${gameId}/action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(requestBody)
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || 'Undo failed', 'error');
          return;
        }

    // Track pending swaps for age transition Design Bureau
    let pendingAgeTransitionSwaps = [];

    function renderAgeTransitionDesignBureau(state, myState) {
      const allUpgrades = upgradesData?.allUpgrades || {};
      const allTechs = upgradesData?.allTechnologies || {};
      const blueprint = myState.blueprint || {};
      const technologies = myState.technologies || [];

      // Find available upgrades from owned technologies
      // Upgrades have requiredTech field that must match an owned technology
      const availableUpgrades = {};
      const currentAge = state.age || 1;
      for (const upgradeId of Object.keys(allUpgrades)) {
        const upgrade = allUpgrades[upgradeId];
        // Check if player owns the required technology
        if (upgrade.requiredTech && technologies.includes(upgrade.requiredTech)) {
          // Check age restriction
          if (upgrade.age && upgrade.age > currentAge) continue;

          const slotType = upgrade.slotType?.replace('Slots', '');
          if (slotType) {
            if (!availableUpgrades[slotType]) availableUpgrades[slotType] = [];
            availableUpgrades[slotType].push({ ...upgrade, id: upgradeId });
          }
        }
      }

      let html = '<div class="age-transition-design-bureau" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">';
      html += '<h4 style="margin-top: 0;">Select Upgrades to Install</h4>';
      html += '<p style="font-size: 12px; color: #666; margin-bottom: 15px;">Duplicates are allowed. Click empty slots to fill them with available upgrades.</p>';

      // Show each slot type with empty slots
      const slotTypes = [
        { key: 'frameSlots', name: 'Frame', icon: SLOT_ICONS.frame },
        { key: 'fabricSlots', name: 'Fabric', icon: SLOT_ICONS.fabric },
        { key: 'driveSlots', name: 'Drive', icon: SLOT_ICONS.drive },
        { key: 'componentSlots', name: 'Component', icon: SLOT_ICONS.component }
      ];

      for (const slotType of slotTypes) {
        const slots = blueprint[slotType.key] || [];
        const shortType = slotType.key.replace('Slots', '');
        const upgrades = availableUpgrades[shortType] || [];

        if (slots.length === 0) continue;

        html += '<div style="margin-bottom: 10px;">';
        html += '<strong>' + slotType.icon + ' ' + slotType.name + ':</strong> ';

        for (let i = 0; i < slots.length; i++) {
          const upgradeId = slots[i];
          const pendingSwap = pendingAgeTransitionSwaps.find(s => s.slotType === shortType && s.slotIndex === i);

          if (pendingSwap) {
            // Show pending installation
            const upgrade = allUpgrades[pendingSwap.upgradeId];
            html += '<span style="background: #d4edda; padding: 3px 8px; border-radius: 4px; margin: 2px; display: inline-block;">';
            html += (upgrade?.name || pendingSwap.upgradeId) + ' (pending)';
            html += ' <button onclick="cancelAgeTransitionSwap(' + i + ', \'' + shortType + '\')" style="border:none; background:none; cursor:pointer; color:#dc3545;">✕</button>';
            html += '</span>';
          } else if (upgradeId) {
            // Show installed upgrade
            const upgrade = allUpgrades[upgradeId];
            html += '<span style="background: #e9ecef; padding: 3px 8px; border-radius: 4px; margin: 2px; display: inline-block;">';
            html += (upgrade?.name || upgradeId);
            html += '</span>';
          } else {
            // Show empty slot with dropdown
            if (upgrades.length > 0) {
              html += '<select onchange="addAgeTransitionSwap(\'' + shortType + '\', ' + i + ', this.value)" style="margin: 2px; padding: 3px;">';
              html += '<option value="">-- Empty --</option>';
              for (const upgrade of upgrades) {
                html += '<option value="' + upgrade.id + '">' + upgrade.name + '</option>';
              }
              html += '</select>';
            } else {
              html += '<span style="background: #fff3cd; padding: 3px 8px; border-radius: 4px; margin: 2px; display: inline-block; font-style: italic;">';
              html += 'Empty (no upgrades available)';
              html += '</span>';
            }
          }
        }

        html += '</div>';
      }

      // Show pending changes summary
      if (pendingAgeTransitionSwaps.length > 0) {
        html += '<div style="margin-top: 10px; padding: 10px; background: #d4edda; border-radius: 4px;">';
        html += '<strong>Pending (' + pendingAgeTransitionSwaps.length + ' changes):</strong> ';
        for (const swap of pendingAgeTransitionSwaps) {
          const upgrade = allUpgrades[swap.upgradeId];
          html += (upgrade?.name || swap.upgradeId) + ' ';
        }
        html += '</div>';
      }

      // Submit button
      html += '<div style="margin-top: 15px;">';
      html += '<button class="action-btn" onclick="submitAgeTransitionDesignBureau()" style="background: #28a745; border-color: #28a745;">';
      html += 'Done with Free Upgrades (' + pendingAgeTransitionSwaps.length + ' changes)';
      html += '</button>';
      html += '</div>';

      html += '</div>';
      return html;
    }

    function addAgeTransitionSwap(slotType, slotIndex, upgradeId) {
      if (!upgradeId) return;

      // Remove any existing change for this slot
      pendingAgeTransitionSwaps = pendingAgeTransitionSwaps.filter(s => !(s.slotType === slotType && s.slotIndex === slotIndex));

      // Add new change
      pendingAgeTransitionSwaps.push({
        action: 'install',
        slotType: slotType,
        slotIndex: slotIndex,
        upgradeId: upgradeId
      });

      // Re-render
      renderGame(gameState);
    }

    function cancelAgeTransitionSwap(slotIndex, slotType) {
      pendingAgeTransitionSwaps = pendingAgeTransitionSwaps.filter(s => !(s.slotType === slotType && s.slotIndex === slotIndex));
      renderGame(gameState);
    }

        // Build classes with symbol-specific highlighting
        let classes = 'location' + (isOccupied ? ' occupied' : '') + (canPlace ? ' available' : '');

        }

        locationsHtml += '<div class="' + classes + '" ' +
          'data-testid="location-' + locId + '" ' +
          'role="button" ' +
          tabindexAttr + ' ' +
          ariaDisabled + ' ' +
          onclickAttr + ' ' +
          onkeydownAttr + ' ' +
          'aria-label="' + loc.name + ': ' + loc.description + '" ' +
          'title="' + tooltipText + '">' +
          '<div class="location-symbol">' + getSymbolIcon(loc.symbol) + '</div>' +
          '<div class="location-name">' + loc.name + '</div>' +
          warningHtml +
          occupantHtml +
          '</div>';

    function getSpecializationDiscount(playerTechs, techType) {
      const techTypeMap = {
        structure: ['rigid_frame', 'duralumin_girders', 'wooden_framework', 'wire_bracing', 'steel_framework', 'internal_keel', 'geodetic_structure', 'modular_construction'],
        fabric: ['dining_saloon', 'rubberized_cotton', 'doped_canvas', 'goldbeater_skin', 'fireproof_coating', 'aluminum_doping', 'composite_covering'],
        drive: ['maybach_engine', 'daimler_engine', 'improved_propeller', 'dual_engine_mount', 'diesel_powerplant', 'streamlined_nacelle', 'supercharged_engine'],
        component: ['passenger_gondola', 'observation_deck', 'cargo_systems', 'radio_equipment', 'sleeping_quarters', 'mail_systems', 'luxury_fittings', 'advanced_navigation', 'pressurization'],
        gas: ['helium_handling']
      };

      const techsInTrack = playerTechs.filter(t => {
        for (const [type, ids] of Object.entries(techTypeMap)) {
          if (ids.includes(t) && type === techType) return true;
        }
        return false;
      }).length;

      if (techsInTrack >= 5) return 2;
      if (techsInTrack >= 3) return 1;
      return 0;
    }

              <div style="color: #888;">Route requires Range: ${distance}</div>
            </div>

            <div class="section-title">Select a Launched Ship</div>
            ${eligibleShips.length === 0 ? '<div style="color: #888;">No ships with enough range</div>' :
              eligibleShips.map(ship => `
                <div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">
                  <span>✈️ Ship (Range: ${ship.stats?.range || 1})</span>
                  <button class="action-btn primary" onclick="claimRoute('${ship.id}', '${routeId}')">
                    Use This Ship
                  </button>
                </div>
              `).join('')
            }
          </div>
        </div>
      `;
    }

    function claimRoute(shipId, routeId) {
      closeModal();
      performAction('CLAIM_ROUTE', { shipId, routeId });
    }

    // === HAZARD CHECKS ===
    function performHazardCheck(shipId) {
      if (confirm('Perform hazard check? This will draw from your hazard deck and test your ship.')) {
        performAction('PERFORM_HAZARD_CHECK', { shipId });
      }
    }

    // Respond to pending hazard after LAUNCH_SHIP
    function respondToHazard(shipId, spendEngineers) {
      performAction('RESPOND_TO_HAZARD', { shipId, spendEngineers });
    }

    // === MARKET CARDS ===
    function buyMarketCard(cardId) {
      performAction('BUY_MARKET_CARD', { cardId });
    }

    // === SCORING ===
    function calculateScores() {
      if (confirm('Calculate final scores? This will end the game.')) {
        performAction('CALCULATE_SCORES');
      }
    }

    function openSlot(slotType, slotIndex) {
      if (!gameState?.state) return;

      const state = gameState.state;
      const myState = state.players[currentUserId];
      const slotKey = `${slotType}Slots`;
      const currentUpgrade = myState.blueprint[slotKey]?.[slotIndex];

      // Show the upgrade modal
      showUpgradeModal(slotType, slotIndex, currentUpgrade);
    }

    // Show upgrade selection modal
    function showUpgradeModal(slotType, slotIndex, currentUpgrade) {
      const container = document.getElementById('modal-container');
      const slotKey = `${slotType}Slots`;
      const state = gameState.state;
      const myState = state.players[currentUserId];

      // Get available upgrades for this slot type
      const available = upgradesData?.available?.[slotKey] || [];
      const allUpgrades = upgradesData?.allUpgrades || {};
      const allTechs = upgradesData?.allTechnologies || {};

      // Get all possible upgrades for this slot type (even locked ones)
      const allForSlot = Object.values(allUpgrades).filter(u => u.slotType === slotKey);

      let html = `
        <div class="modal-overlay" onclick="closeModal(event)">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
              <span class="modal-title">${SLOT_ICONS[slotType]} ${SLOT_NAMES[slotType]} Slot ${slotIndex + 1}</span>
              <button class="modal-close" data-testid="modal-close" onclick="closeModal()">&times;</button>
            </div>
      `;

      // If slot has an upgrade, show remove option
      if (currentUpgrade) {
        const upgrade = allUpgrades[currentUpgrade];
        html += `
          <div style="margin-bottom: 15px; padding: 10px; background: rgba(196, 163, 90, 0.1); border-radius: 8px;">
            <div style="font-weight: bold; margin-bottom: 5px;">Currently Installed:</div>
            <div class="upgrade-name">${upgrade?.name || currentUpgrade}</div>
            ${renderUpgradeStats(upgrade)}
            <button class="remove-btn" onclick="removeUpgrade('${slotType}', ${slotIndex})">
              Remove Upgrade
            </button>
          </div>
        `;
      }

      // Show available upgrades
      html += `<div class="section-title" style="margin-bottom: 10px;">Available Upgrades</div>`;

      if (available.length === 0 && allForSlot.length === 0) {
        html += `<div class="no-upgrades">No upgrades available for this slot type.</div>`;
      } else {
        html += `<div class="upgrade-list">`;

        // First show available (unlocked) upgrades
        for (const upgrade of available) {
          // Skip if already installed
          if (currentUpgrade === upgrade.id) continue;

          html += `
            <div class="upgrade-option" onclick="installUpgrade('${slotType}', ${slotIndex}, '${upgrade.id}')">
              <div class="upgrade-name">${upgrade.name}</div>
              ${renderUpgradeStats(upgrade)}
            </div>
          `;
        }

        // Then show locked upgrades
        const availableIds = available.map(u => u.id);
        const locked = allForSlot.filter(u => !availableIds.includes(u.id) && u.age <= state.age);

        for (const upgrade of locked) {
          if (currentUpgrade === upgrade.id) continue;

          const tech = allTechs[upgrade.requiredTech];
          html += `
            <div class="upgrade-option locked">
              <div class="upgrade-name">${upgrade.name}</div>
              ${renderUpgradeStats(upgrade)}
              <div class="upgrade-required missing">
                Requires: ${tech?.name || upgrade.requiredTech}
              </div>
            </div>
          `;
        }

        html += `</div>`;
      }

      html += `
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    // Render upgrade stats as badges
    function renderUpgradeStats(upgrade) {
      if (!upgrade) return '';

      let html = '<div class="upgrade-stats">';

      // Show weight
      if (upgrade.weight) {
        html += `<span class="upgrade-stat negative">Weight ${Math.abs(upgrade.weight)}</span>`;
      }

      // Show stats
      if (upgrade.stats) {
        for (const [stat, value] of Object.entries(upgrade.stats)) {
          if (value > 0) {
            html += `<span class="upgrade-stat">+${value} ${STAT_NAMES[stat] || stat}</span>`;
          }
        }
      }

      // Show hull cost
      if (upgrade.hullCost) {
        html += `<span class="upgrade-stat negative">+£${upgrade.hullCost} Hull</span>`;
      }

      html += '</div>';
      return html;
    }

    // Close modal
    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('modal-container').innerHTML = '';
    }

    // Install upgrade action
    async function installUpgrade(slotType, slotIndex, upgradeId) {
      closeModal();
      await performAction('INSTALL_UPGRADE', { slotType, slotIndex, upgradeId });
      // Reload upgrades data in case it changed
      await loadUpgrades();
    }

    // Remove upgrade action
    async function removeUpgrade(slotType, slotIndex) {
      closeModal();
      await performAction('REMOVE_UPGRADE', { slotType, slotIndex });
    }

    function goBack() {
      clearInterval(refreshInterval);
      window.location.href = '/';
    }

    // Switch to viewing as a different player (dev mode only)
    function switchPlayer(playerId) {
      if (!isDevMode || !gameState?.state) return;

      const player = gameState.state.players[playerId];
      if (!player) return;

      currentUserId = playerId;
      currentUsername = player.faction; // Use faction name as username in dev mode
      selectedCardIndex = null; // Clear any card selection
      renderGame();
    }

    // Start
    init();
  </script>
</body>
</html>
