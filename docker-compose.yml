version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: upship-postgres
    environment:
      POSTGRES_USER: upship
      POSTGRES_PASSWORD: upship_dev_password
      POSTGRES_DB: upship
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upship -d upship"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
