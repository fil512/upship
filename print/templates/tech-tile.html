<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Tile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 450px;
      height: 285px;
      margin: 0;
      padding: 0;
      background: white;
    }

    .tech-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 450px;
      height: 285px;
      padding: 20px;
      background: var(--slot-gradient, #f5f3ee);
      border: 8px solid var(--slot-color);
      border-radius: 24px;
      position: relative;
      box-shadow:
        inset 0 3px 6px rgba(255, 255, 255, 0.5),
        inset 0 -3px 6px rgba(0, 0, 0, 0.1),
        0 6px 12px rgba(0, 0, 0, 0.15);
    }

    /* Hull cost badge */
    .cost-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
      border: 4px solid #4b5563;
      border-radius: 50%;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    /* Icons area - left justified, max 4 per row */
    .tile-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: flex-start;
      align-content: center;
      gap: 12px;
      max-width: 292px; /* 4 icons (64px each) + 3 gaps (12px each) = 292px */
      flex: 1;
      padding-top: 12px;
    }

    .tile-icons svg {
      width: 64px;
      height: 64px;
    }

    /* Tile name */
    .tile-name {
      font-size: 34px;
      font-weight: 800;
      color: var(--slot-color, #333);
      text-align: center;
      max-width: 100%;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
    }

    /* Slot type colors - professional boardgame palette */
    .slot-driveSlots {
      --slot-color: #d97706;
      --slot-gradient: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
    }
    .slot-frameSlots {
      --slot-color: #1d4ed8;
      --slot-gradient: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%);
    }
    .slot-fabricSlots {
      --slot-color: #7c3aed;
      --slot-gradient: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 50%, #c4b5fd 100%);
    }
    .slot-componentSlots {
      --slot-color: #059669;
      --slot-gradient: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 50%, #6ee7b7 100%);
    }
  </style>
</head>
<body>
  <div id="tile" class="tech-tile"></div>

  <script>
    // Exact SVG icons from web/src/lib/icons/svg/ with correct colors
    const STAT_ICONS = {
      speed: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs><path id="speed-blade" d="M12 12 C 11 12 10 9 10 5 C 10 3 11 2 12 2 C 13 2 14 3 14 5 C 14 9 13 12 12 12 Z" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/></defs>
        <use href="#speed-blade"/><use href="#speed-blade" transform="rotate(120 12 12)"/><use href="#speed-blade" transform="rotate(240 12 12)"/>
        <circle cx="12" cy="12" r="2" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/>
      </svg>`,
      range: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="12" r="3" fill="#4b5563"/>
        <path d="M8 10h8v-3l6 5-6 5v-3H8v-4z" fill="#4b5563"/>
      </svg>`,
      ceiling: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#4b5563"/>
      </svg>`,
      reliability: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="#4b5563"/>
      </svg>`,
      luxury: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 9h20L12 2z" fill="#4b5563"/>
        <path d="M2 9l10 13 10-13H2z" fill="#4b5563" opacity="0.8"/>
        <path d="M7 9l5 13 5-13H7z" fill="#fff" opacity="0.2"/>
      </svg>`,
      lift: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C7.58 2 4 5.58 4 10c0 3.84 2.68 7.07 6.27 7.84L10 20h4l-.27-2.16C17.32 17.07 20 13.84 20 10c0-4.42-3.58-8-8-8zM12 22h-2v-1h4v1h-2z" fill="#4b5563"/>
      </svg>`,
      weight: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c-1.1 0-2 .9-2 2 0 .6.3 1.1.7 1.5H7c-1.1 0-2 .9-2 2s.9 2 2 2h3.1v8.5c-2.3-.5-4.1-2.4-4.5-4.8l-.1-.7-2.9 2.2 1.2 3.6c.6 1.8 2.3 3 4.2 3h8.4c1.9 0 3.6-1.2 4.2-3l1.2-3.6-2.9-2.2-.1.7c-.4 2.4-2.2 4.3-4.5 4.8V9.5H17c1.1 0 2-.9 2-2s-.9-2-2-2h-3.7c.4-.4.7-.9.7-1.5 0-1.1-.9-2-2-2z" fill="#4b5563"/>
      </svg>`,
      gas_socket: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="4 2"/>
        <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">5</text>
      </svg>`,
      income: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="11" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#66bb6a" stroke-width="0.5"/>
        <circle cx="12" cy="12" r="8" fill="none" stroke="#66bb6a" stroke-width="0.5" stroke-dasharray="1 1"/>
        <path d="M10 8c0-1.65 1.35-3 3-3s2.5 1 2.5 1" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
        <path d="M13 5c-1.65 0-3 1.35-3 3 0 1.5 1 2.5 2 3.5l-2 4.5h6" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="9" y1="11" x2="15" y2="11" stroke="#1a1a2e" stroke-width="2"/>
      </svg>`,
      armor: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="#4b5563"/>
      </svg>`
    };

    function renderTileIcons(stats, weight) {
      const icons = [];
      const order = ['gas_socket', 'lift', 'reliability', 'ceiling', 'range', 'speed', 'income', 'luxury', 'armor'];

      for (const stat of order) {
        const count = stats[stat] || 0;
        for (let i = 0; i < count; i++) {
          icons.push(STAT_ICONS[stat]);
        }
      }

      for (let i = 0; i < weight; i++) {
        icons.push(STAT_ICONS.weight);
      }

      return icons.join('');
    }

    function renderTile(tile) {
      const slotClass = `slot-${tile.slotType}`;
      const tileIcons = renderTileIcons(tile.stats, tile.weight);

      document.getElementById('tile').className = `tech-tile ${slotClass}`;
      document.getElementById('tile').innerHTML = `
        <div class="cost-badge">${tile.hullCost || 1}</div>
        <div class="tile-icons">
          ${tileIcons}
        </div>
        <span class="tile-name">${tile.name}</span>
      `;
    }

    window.renderTile = renderTile;
  </script>
</body>
</html>
