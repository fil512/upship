<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP SHIP! Player Board - Blueprint</title>
  <style>
    /* Blueprint Board - 11" x 8.5" at 300 DPI = 3300 x 2550 px (landscape) */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      margin: 0;
      padding: 0;
      width: 3300px;
      height: 2550px;
    }

    .player-board {
      width: 3300px;
      height: 2550px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      color: #e8e4d9;
    }

    /* === FACTION HEADER === */
    .faction-header {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 20px 40px;
      background: var(--faction-color);
      border-radius: 16px;
      border: 5px solid var(--faction-border);
      flex-shrink: 0;
    }

    .faction-flag {
      width: 120px;
      height: 80px;
    }

    .faction-flag svg {
      width: 100%;
      height: 100%;
    }

    .faction-info { flex: 1; }

    .faction-name {
      font-size: 56px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .faction-ability {
      font-size: 26px;
      color: rgba(255,255,255,0.85);
      margin-top: 6px;
    }

    .age-badge {
      padding: 12px 32px;
      border-radius: 24px;
      font-size: 36px;
      font-weight: 700;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 4px solid rgba(255,255,255,0.4);
    }

    .age-badge.age-1 { background: #8B4513; border-color: #A0522D; }
    .age-badge.age-2 { background: #2E7D32; border-color: #4CAF50; }
    .age-badge.age-3 { background: #1565C0; border-color: #2196F3; }

    /* === BLUEPRINT SECTION === */
    .blueprint-section {
      background: rgba(30, 41, 59, 0.9);
      border-radius: 16px;
      padding: 24px;
      border: 4px solid #475569;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .blueprint-title {
      font-size: 32px;
      font-weight: 700;
      color: #c4a35a;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .airship-container {
      flex: 1;
      min-height: 0;
    }

    .airship-svg {
      width: 100%;
      height: 100%;
    }

    /* Tech tile slots - scaled in SVG */
    .tile-slot {
      fill: rgba(30, 41, 59, 0.8);
      stroke-width: 5;
      stroke-dasharray: 15 8;
      rx: 10;
    }

    .tile-slot.frame { stroke: #3b82f6; }
    .tile-slot.fabric { stroke: #8b5cf6; }
    .tile-slot.drive { stroke: #f59e0b; }
    .tile-slot.component { stroke: #10b981; }

    .slot-label {
      font-size: 24px;
      fill: #64748b;
      text-anchor: middle;
      font-weight: 600;
    }

    /* === SHIP STATS SECTION === */
    .stats-section {
      background: rgba(30, 41, 59, 0.9);
      border-radius: 16px;
      padding: 24px 40px;
      border: 4px solid #475569;
      flex-shrink: 0;
    }

    .stats-title {
      font-size: 32px;
      font-weight: 700;
      color: #c4a35a;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    .stat-table {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      flex: 0 0 calc(50% - 8px);
    }

    .stat-icon {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
    }

    .stat-icon svg {
      width: 100%;
      height: 100%;
    }

    .stat-name {
      width: 180px;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .stat-row.speed .stat-name { color: #f59e0b; }
    .stat-row.range .stat-name { color: #3b82f6; }
    .stat-row.ceiling .stat-name { color: #9ca3af; }
    .stat-row.reliability .stat-name { color: #4caf50; }
    .stat-row.luxury .stat-name { color: #c4a35a; }
    .stat-row.armor .stat-name { color: #ef4444; }

    .stat-cubes {
      display: flex;
      gap: 12px;
    }

    /* Cube slots - 12mm with clearance = 142px at 300 DPI */
    .cube-slot {
      width: 142px;
      height: 142px;
      background: #0f172a;
      border: 4px solid #334155;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: #475569;
    }

    .stat-row.speed .cube-slot { border-color: rgba(245, 158, 11, 0.5); }
    .stat-row.range .cube-slot { border-color: rgba(59, 130, 246, 0.5); }
    .stat-row.ceiling .cube-slot { border-color: rgba(156, 163, 175, 0.5); }
    .stat-row.reliability .cube-slot { border-color: rgba(76, 175, 80, 0.5); }
    .stat-row.luxury .cube-slot { border-color: rgba(196, 163, 90, 0.5); }
    .stat-row.armor .cube-slot { border-color: rgba(239, 68, 68, 0.5); }

    .stat-note {
      font-size: 20px;
      color: #64748b;
      font-style: italic;
      margin-left: auto;
      white-space: nowrap;
    }

    /* === FACTION COLORS === */
    .player-board.germany {
      --faction-color: #1a1a1a;
      --faction-border: #c4a35a;
    }

    .player-board.britain {
      --faction-color: #1a237e;
      --faction-border: #c62828;
    }

    .player-board.usa {
      --faction-color: #0d47a1;
      --faction-border: #b71c1c;
    }

    .player-board.italy {
      --faction-color: #1b5e20;
      --faction-border: #c62828;
    }
  </style>
</head>
<body>
  <div id="board" class="player-board"></div>

  <script>
    const ICONS = {
      speed: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs><path id="blade" d="M12 12 C 11 12 10 9 10 5 C 10 3 11 2 12 2 C 13 2 14 3 14 5 C 14 9 13 12 12 12 Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/></defs>
        <use href="#blade"/><use href="#blade" transform="rotate(120 12 12)"/><use href="#blade" transform="rotate(240 12 12)"/>
        <circle cx="12" cy="12" r="2" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      </svg>`,
      range: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="12" r="3" fill="#3b82f6"/>
        <path d="M8 10h8v-3l6 5-6 5v-3H8v-4z" fill="#3b82f6"/>
      </svg>`,
      ceiling: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#9ca3af"/>
      </svg>`,
      reliability: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
        <path d="M8 12l3 3 5-6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`,
      luxury: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 9h20L12 2z" fill="#c4a35a"/>
        <path d="M2 9l10 13 10-13H2z" fill="#c4a35a" opacity="0.8"/>
      </svg>`,
      armor: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 6v5c0 5.5 3.4 10.4 8 12 4.6-1.6 8-6.5 8-12V6l-8-4z" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
      </svg>`,
      germany: `<svg viewBox="0 0 5 3"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#D00"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>`,
      britain: `<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></svg>`,
      usa: `<svg viewBox="0 0 190 100"><rect width="190" height="100" fill="#B22234"/><g fill="#fff"><rect y="7.69" width="190" height="7.69"/><rect y="23.08" width="190" height="7.69"/><rect y="38.46" width="190" height="7.69"/><rect y="53.85" width="190" height="7.69"/><rect y="69.23" width="190" height="7.69"/><rect y="84.62" width="190" height="7.69"/></g><rect width="76" height="53.85" fill="#3C3B6E"/></svg>`,
      italy: `<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg>`
    };

    const FACTION_DATA = {
      germany: { name: 'Germany', ability: 'Blaugas Pioneers: Use Blaugas for +1 Range' },
      britain: { name: 'Britain', ability: 'Imperial Mooring: British territories count as home base' },
      usa: { name: 'United States', ability: 'Helium Monopoly: Buy domestic helium at £2 when market empty' },
      italy: { name: 'Italy', ability: 'Long Range (+1 Range) / Low Ceiling (-1 Component in Ages II & III)' }
    };

    const AGE_NAMES = { 1: 'Pioneer Era', 2: 'Great War', 3: 'Golden Age' };

    // Slot counts by age and faction
    function getSlotCounts(faction, age) {
      const standard = {
        1: { frame: 2, fabric: 2, drive: 2, component: 2 },
        2: { frame: 2, fabric: 2, drive: 3, component: 3 },
        3: { frame: 3, fabric: 3, drive: 3, component: 4 }
      };
      const counts = { ...standard[age] };
      if (faction === 'italy' && age >= 2) {
        counts.component -= 1;
      }
      return counts;
    }

    // Tech tile dimensions in SVG units (will scale with viewBox)
    // Actual tiles are 450x285px (1.5" x 0.95" at 300 DPI)
    const TILE_W = 280;
    const TILE_H = 177;

    function renderAirshipBlueprint(faction, age) {
      const slots = getSlotCounts(faction, age);

      // Generate fabric slots (top of envelope)
      let fabricSlots = '';
      const fabricStartX = 100;
      const fabricY = 120;
      for (let i = 0; i < slots.fabric; i++) {
        const x = fabricStartX + i * (TILE_W + 20);
        fabricSlots += `
          <rect x="${x}" y="${fabricY}" width="${TILE_W}" height="${TILE_H}" class="tile-slot fabric"/>
          <text x="${x + TILE_W/2}" y="${fabricY + TILE_H/2 + 8}" class="slot-label">FABRIC</text>
        `;
      }

      // Generate frame slots (central keel)
      let frameSlots = '';
      const frameY = fabricY + TILE_H + 30;
      for (let i = 0; i < slots.frame; i++) {
        const x = fabricStartX + i * (TILE_W + 20);
        frameSlots += `
          <rect x="${x}" y="${frameY}" width="${TILE_W}" height="${TILE_H}" class="tile-slot frame"/>
          <text x="${x + TILE_W/2}" y="${frameY + TILE_H/2 + 8}" class="slot-label">FRAME</text>
        `;
      }

      // Generate component slots (gondola)
      let componentSlots = '';
      const componentY = frameY + TILE_H + 30;
      for (let i = 0; i < slots.component; i++) {
        const x = fabricStartX + i * (TILE_W + 20);
        componentSlots += `
          <rect x="${x}" y="${componentY}" width="${TILE_W}" height="${TILE_H}" class="tile-slot component"/>
          <text x="${x + TILE_W/2}" y="${componentY + TILE_H/2 + 8}" class="slot-label">COMPONENT</text>
        `;
      }

      // Generate drive slots (tail section - vertical stack)
      let driveSlots = '';
      const driveX = 1150;
      const driveStartY = 150;
      for (let i = 0; i < slots.drive; i++) {
        const y = driveStartY + i * (TILE_H + 20);
        driveSlots += `
          <rect x="${driveX}" y="${y}" width="${TILE_W}" height="${TILE_H}" class="tile-slot drive"/>
          <text x="${driveX + TILE_W/2}" y="${y + TILE_H/2 + 8}" class="slot-label">DRIVE</text>
        `;
      }

      return `
        <svg viewBox="0 0 1500 750" class="airship-svg" preserveAspectRatio="xMidYMid meet">
          <!-- Background -->
          <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#1e293b"/>
              <stop offset="100%" style="stop-color:#0f172a"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#skyGrad)" rx="16"/>

          <!-- Airship envelope outline -->
          <ellipse cx="550" cy="320" rx="480" ry="200" fill="none" stroke="#475569" stroke-width="4"/>

          <!-- Internal frame lines -->
          <line x1="90" y1="320" x2="1010" y2="320" stroke="#334155" stroke-width="2" stroke-dasharray="15 8"/>
          <line x1="280" y1="130" x2="280" y2="510" stroke="#334155" stroke-width="2" stroke-dasharray="10 5"/>
          <line x1="550" y1="125" x2="550" y2="515" stroke="#334155" stroke-width="2" stroke-dasharray="10 5"/>
          <line x1="820" y1="140" x2="820" y2="500" stroke="#334155" stroke-width="2" stroke-dasharray="10 5"/>

          <!-- Gondola (cabin) -->
          <path d="M 200 510 Q 200 680 320 680 L 780 680 Q 900 680 900 510" fill="none" stroke="#475569" stroke-width="4"/>

          <!-- Tail fins -->
          <path d="M 980 320 L 1200 140 L 1200 220 L 1040 320" fill="none" stroke="#475569" stroke-width="4"/>
          <path d="M 980 320 L 1200 500 L 1200 420 L 1040 320" fill="none" stroke="#475569" stroke-width="4"/>
          <line x1="1020" y1="320" x2="1150" y2="320" stroke="#475569" stroke-width="3"/>

          <!-- Propellers -->
          <g transform="translate(1230, 180)">
            <circle r="35" fill="none" stroke="#475569" stroke-width="3"/>
            <line x1="-25" y1="0" x2="25" y2="0" stroke="#64748b" stroke-width="4"/>
            <line x1="0" y1="-25" x2="0" y2="25" stroke="#64748b" stroke-width="4"/>
          </g>
          <g transform="translate(1230, 460)">
            <circle r="35" fill="none" stroke="#475569" stroke-width="3"/>
            <line x1="-25" y1="0" x2="25" y2="0" stroke="#64748b" stroke-width="4"/>
            <line x1="0" y1="-25" x2="0" y2="25" stroke="#64748b" stroke-width="4"/>
          </g>

          <!-- Nose cone -->
          <ellipse cx="80" cy="320" rx="25" ry="80" fill="none" stroke="#475569" stroke-width="3"/>

          <!-- Section labels -->
          <text x="440" y="95" text-anchor="middle" font-size="26" fill="#64748b" font-weight="600">ENVELOPE</text>
          <text x="440" y="720" text-anchor="middle" font-size="26" fill="#64748b" font-weight="600">GONDOLA</text>
          <text x="1290" y="325" text-anchor="middle" font-size="26" fill="#64748b" font-weight="600">DRIVE</text>

          <!-- Tech tile slots -->
          ${fabricSlots}
          ${frameSlots}
          ${componentSlots}
          ${driveSlots}
        </svg>
      `;
    }

    function renderBoard(faction, age) {
      const data = FACTION_DATA[faction];
      const board = document.getElementById('board');
      board.className = `player-board ${faction}`;

      // Only show Armor stat in Age 2
      const armorRow = age === 2 ? `
        <div class="stat-row armor">
          <div class="stat-icon">${ICONS.armor}</div>
          <div class="stat-name">Armor</div>
          <div class="stat-cubes">
            ${[1,2,3,4].map(n => `<div class="cube-slot">${n}</div>`).join('')}
          </div>
          <span class="stat-note">flak defense</span>
        </div>
      ` : '';

      board.innerHTML = `
        <!-- Faction Header -->
        <div class="faction-header">
          <div class="faction-flag">${ICONS[faction]}</div>
          <div class="faction-info">
            <div class="faction-name">${data.name}</div>
            <div class="faction-ability">${data.ability}</div>
          </div>
          <div class="age-badge age-${age}">Age ${['I','II','III'][age-1]}: ${AGE_NAMES[age]}</div>
        </div>

        <!-- Blueprint with Airship Shape -->
        <div class="blueprint-section">
          <div class="blueprint-title">Blueprint</div>
          <div class="airship-container">
            ${renderAirshipBlueprint(faction, age)}
          </div>
        </div>

        <!-- Ship Stats -->
        <div class="stats-section">
          <div class="stats-title">Ship Stats</div>
          <div class="stat-table">
            <div class="stat-row speed">
              <div class="stat-icon">${ICONS.speed}</div>
              <div class="stat-name">Speed</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">min 1 required</span>
            </div>
            <div class="stat-row range">
              <div class="stat-icon">${ICONS.range}</div>
              <div class="stat-name">Range</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">min 1 required</span>
            </div>
            <div class="stat-row ceiling">
              <div class="stat-icon">${ICONS.ceiling}</div>
              <div class="stat-name">Ceiling</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">route requirement</span>
            </div>
            <div class="stat-row reliability">
              <div class="stat-icon">${ICONS.reliability}</div>
              <div class="stat-name">Reliability</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">hazard checks</span>
            </div>
            <div class="stat-row luxury">
              <div class="stat-icon">${ICONS.luxury}</div>
              <div class="stat-name">Luxury</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">Age III bonus</span>
            </div>
            ${armorRow}
          </div>
        </div>
      `;
    }

    window.renderBoard = renderBoard;
  </script>
</body>
</html>
