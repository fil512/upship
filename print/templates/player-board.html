<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP SHIP! Player Board - Blueprint</title>
  <style>
    /* Blueprint Board - 11" x 8.5" at 300 DPI = 3300 x 2550 px (landscape) */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      margin: 0;
      padding: 0;
      width: 3300px;
      height: 2550px;
    }

    .player-board {
      width: 3300px;
      height: 2550px;
      background: #ffffff;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      color: #1a1a1a;
    }

    /* === FACTION HEADER === */
    .faction-header {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 12px 40px;
      background: var(--faction-color);
      border-radius: 16px;
      border: 5px solid var(--faction-border);
      flex-shrink: 0;
    }

    .faction-flag {
      width: 80px;
      height: 53px;
    }

    .faction-flag svg {
      width: 100%;
      height: 100%;
    }

    .faction-info { flex: 1; }

    .faction-name {
      font-size: 42px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .faction-ability {
      font-size: 20px;
      color: rgba(255,255,255,0.85);
      margin-top: 2px;
    }

    .age-badge {
      padding: 8px 24px;
      border-radius: 16px;
      font-size: 28px;
      font-weight: 700;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 4px solid rgba(255,255,255,0.4);
    }

    .age-badge.age-1 { background: #8B4513; border-color: #A0522D; }
    .age-badge.age-2 { background: #2E7D32; border-color: #4CAF50; }
    .age-badge.age-3 { background: #1565C0; border-color: #2196F3; }

    /* === BLUEPRINT SECTION === */
    .blueprint-section {
      background: linear-gradient(180deg, #e8e4dc 0%, #f5f3ee 50%, #e8e4dc 100%);
      border-radius: 16px;
      border: 4px solid #6b7280;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .blueprint-title {
      position: absolute;
      top: 15px;
      left: 30px;
      font-size: 24px;
      font-weight: 700;
      color: #92400e;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Airship container - positions the whole airship layout */
    .airship-layout {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Airship outline SVG */
    .airship-outline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Section labels */
    .section-label {
      position: absolute;
      font-size: 22px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* Tech tile slots - EXACT size as printed tiles: 450x285px */
    .tile-slot {
      position: absolute;
      width: 450px;
      height: 285px;
      background: rgba(255, 255, 255, 0.7);
      border: 5px dashed;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile-slot.frame { border-color: #1d4ed8; }
    .tile-slot.fabric { border-color: #7c3aed; }
    .tile-slot.drive { border-color: #d97706; }
    .tile-slot.component { border-color: #059669; }

    .slot-placeholder {
      font-size: 22px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
    }

    .tile-slot.frame .slot-placeholder { color: #1d4ed8; }
    .tile-slot.fabric .slot-placeholder { color: #7c3aed; }
    .tile-slot.drive .slot-placeholder { color: #d97706; }
    .tile-slot.component .slot-placeholder { color: #059669; }

    /* === SHIP STATS SECTION === */
    .stats-section {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 16px 32px;
      border: 4px solid #6b7280;
      flex-shrink: 0;
    }

    .stats-title {
      font-size: 24px;
      font-weight: 700;
      color: #92400e;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .stat-table {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      flex: 0 0 calc(50% - 5px);
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .stat-icon svg {
      width: 100%;
      height: 100%;
    }

    .stat-name {
      width: 140px;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .stat-row.speed .stat-name { color: #d97706; }
    .stat-row.range .stat-name { color: #1d4ed8; }
    .stat-row.ceiling .stat-name { color: #6b7280; }
    .stat-row.reliability .stat-name { color: #15803d; }
    .stat-row.luxury .stat-name { color: #92400e; }
    .stat-row.armor .stat-name { color: #dc2626; }

    .stat-cubes {
      display: flex;
      gap: 8px;
    }

    .cube-slot {
      width: 110px;
      height: 110px;
      background: #f8f9fa;
      border: 3px solid #d1d5db;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: #9ca3af;
    }

    .stat-row.speed .cube-slot { border-color: #d97706; color: #d97706; }
    .stat-row.range .cube-slot { border-color: #1d4ed8; color: #1d4ed8; }
    .stat-row.ceiling .cube-slot { border-color: #6b7280; color: #6b7280; }
    .stat-row.reliability .cube-slot { border-color: #15803d; color: #15803d; }
    .stat-row.luxury .cube-slot { border-color: #92400e; color: #92400e; }
    .stat-row.armor .cube-slot { border-color: #dc2626; color: #dc2626; }

    .stat-note {
      font-size: 16px;
      color: #6b7280;
      font-style: italic;
      margin-left: auto;
      white-space: nowrap;
    }

    /* === FACTION COLORS === */
    .player-board.germany {
      --faction-color: #1a1a1a;
      --faction-border: #c4a35a;
    }

    .player-board.britain {
      --faction-color: #1a237e;
      --faction-border: #c62828;
    }

    .player-board.usa {
      --faction-color: #0d47a1;
      --faction-border: #b71c1c;
    }

    .player-board.italy {
      --faction-color: #1b5e20;
      --faction-border: #c62828;
    }
  </style>
</head>
<body>
  <div id="board" class="player-board"></div>

  <script>
    const ICONS = {
      speed: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs><path id="blade" d="M12 12 C 11 12 10 9 10 5 C 10 3 11 2 12 2 C 13 2 14 3 14 5 C 14 9 13 12 12 12 Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/></defs>
        <use href="#blade"/><use href="#blade" transform="rotate(120 12 12)"/><use href="#blade" transform="rotate(240 12 12)"/>
        <circle cx="12" cy="12" r="2" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      </svg>`,
      range: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="12" r="3" fill="#3b82f6"/>
        <path d="M8 10h8v-3l6 5-6 5v-3H8v-4z" fill="#3b82f6"/>
      </svg>`,
      ceiling: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#9ca3af"/>
      </svg>`,
      reliability: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
        <path d="M8 12l3 3 5-6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`,
      luxury: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 9h20L12 2z" fill="#c4a35a"/>
        <path d="M2 9l10 13 10-13H2z" fill="#c4a35a" opacity="0.8"/>
      </svg>`,
      armor: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 6v5c0 5.5 3.4 10.4 8 12 4.6-1.6 8-6.5 8-12V6l-8-4z" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
      </svg>`,
      germany: `<svg viewBox="0 0 5 3"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#D00"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>`,
      britain: `<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></svg>`,
      usa: `<svg viewBox="0 0 190 100"><rect width="190" height="100" fill="#B22234"/><g fill="#fff"><rect y="7.69" width="190" height="7.69"/><rect y="23.08" width="190" height="7.69"/><rect y="38.46" width="190" height="7.69"/><rect y="53.85" width="190" height="7.69"/><rect y="69.23" width="190" height="7.69"/><rect y="84.62" width="190" height="7.69"/></g><rect width="76" height="53.85" fill="#3C3B6E"/></svg>`,
      italy: `<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg>`
    };

    const FACTION_DATA = {
      germany: { name: 'Germany', ability: 'Blaugas Pioneers: +1 Range with Blaugas' },
      britain: { name: 'Britain', ability: 'Imperial Mooring: British territories = home base' },
      usa: { name: 'United States', ability: 'Helium Monopoly: Buy helium at £2 when market empty' },
      italy: { name: 'Italy', ability: 'Long Range (+1) / Low Ceiling (-1 Component Ages II-III)' }
    };

    const AGE_NAMES = { 1: 'Pioneer Era', 2: 'Great War', 3: 'Golden Age' };

    // Slot counts by age and faction
    function getSlotCounts(faction, age) {
      const standard = {
        1: { frame: 2, fabric: 2, drive: 2, component: 2 },
        2: { frame: 2, fabric: 2, drive: 3, component: 3 },
        3: { frame: 3, fabric: 3, drive: 3, component: 4 }
      };
      const counts = { ...standard[age] };
      if (faction === 'italy' && age >= 2) {
        counts.component -= 1;
      }
      return counts;
    }

    // Slot positions for each age - following airship shape
    // Tile size: 450x285px
    // Blueprint area is approximately 3240x1750px
    // Airship centered, envelope spans left 2/3, drive slots on right
    function getSlotPositions(age, slots) {
      const TILE_W = 450;
      const TILE_H = 285;
      const GAP = 20;

      // Center of envelope area (left portion of blueprint)
      const envelopeCenterX = 1100;
      const envelopeCenterY = 700;

      // Drive area (right side)
      const driveX = 2450;
      const driveCenterY = 700;

      // Gondola area (below envelope)
      const gondolaY = 1250;
      const gondolaCenterX = 900;

      const positions = {
        fabric: [],
        frame: [],
        component: [],
        drive: []
      };

      // Fabric slots - inside envelope, upper area
      const fabricCount = slots.fabric;
      const fabricTotalW = fabricCount * TILE_W + (fabricCount - 1) * GAP;
      const fabricStartX = envelopeCenterX - fabricTotalW / 2;
      const fabricY = 374;
      for (let i = 0; i < fabricCount; i++) {
        positions.fabric.push({
          x: fabricStartX + i * (TILE_W + GAP),
          y: fabricY
        });
      }

      // Frame slots - inside envelope, middle area
      const frameCount = slots.frame;
      const frameTotalW = frameCount * TILE_W + (frameCount - 1) * GAP;
      const frameStartX = envelopeCenterX - frameTotalW / 2;
      const frameY = 714;
      for (let i = 0; i < frameCount; i++) {
        positions.frame.push({
          x: frameStartX + i * (TILE_W + GAP),
          y: frameY
        });
      }

      // Component slots - gondola area
      const compCount = slots.component;
      const compTotalW = compCount * TILE_W + (compCount - 1) * GAP;
      const compStartX = gondolaCenterX - compTotalW / 2 + 200;
      const compY = 1208;
      for (let i = 0; i < compCount; i++) {
        positions.component.push({
          x: compStartX + i * (TILE_W + GAP),
          y: compY
        });
      }

      // Drive slots - overlapping the tail/drive image
      const driveCount = slots.drive;
      const driveTotalH = driveCount * TILE_H + (driveCount - 1) * GAP;
      const driveStartY = driveCenterY - driveTotalH / 2;
      const driveXPos = 2150;
      for (let i = 0; i < driveCount; i++) {
        positions.drive.push({
          x: driveXPos,
          y: driveStartY + i * (TILE_H + GAP)
        });
      }

      return positions;
    }

    function renderAirshipOutline() {
      return `
        <svg class="airship-outline" viewBox="0 0 3240 1700" preserveAspectRatio="xMidYMid meet">
          <!-- Main envelope ellipse -->
          <ellipse cx="1100" cy="620" rx="950" ry="500"
            fill="none" stroke="#9ca3af" stroke-width="4" stroke-dasharray="20 10"/>

          <!-- Nose cone -->
          <ellipse cx="180" cy="620" rx="50" ry="150"
            fill="none" stroke="#9ca3af" stroke-width="3"/>

          <!-- Internal structure lines -->
          <line x1="230" y1="620" x2="2000" y2="620"
            stroke="#d1d5db" stroke-width="2" stroke-dasharray="15 8"/>
          <line x1="800" y1="150" x2="800" y2="1090"
            stroke="#d1d5db" stroke-width="2" stroke-dasharray="10 5"/>
          <line x1="1400" y1="150" x2="1400" y2="1090"
            stroke="#d1d5db" stroke-width="2" stroke-dasharray="10 5"/>

          <!-- Tail fins -->
          <path d="M 2000 620 L 2350 250 L 2350 400 L 2100 620"
            fill="none" stroke="#9ca3af" stroke-width="3"/>
          <path d="M 2000 620 L 2350 990 L 2350 840 L 2100 620"
            fill="none" stroke="#9ca3af" stroke-width="3"/>

          <!-- Gondola -->
          <path d="M 500 1120 Q 500 1450 700 1450 L 1400 1450 Q 1600 1450 1600 1120"
            fill="none" stroke="#9ca3af" stroke-width="4" stroke-dasharray="20 10"/>

          <!-- Gondola struts -->
          <line x1="600" y1="1000" x2="600" y2="1120" stroke="#d1d5db" stroke-width="2"/>
          <line x1="1050" y1="1050" x2="1050" y2="1120" stroke="#d1d5db" stroke-width="2"/>
          <line x1="1500" y1="1000" x2="1500" y2="1120" stroke="#d1d5db" stroke-width="2"/>

          <!-- Propeller circles -->
          <circle cx="2450" cy="330" r="80" fill="none" stroke="#9ca3af" stroke-width="3"/>
          <line x1="2380" y1="330" x2="2520" y2="330" stroke="#d1d5db" stroke-width="4"/>
          <line x1="2450" y1="260" x2="2450" y2="400" stroke="#d1d5db" stroke-width="4"/>

          <circle cx="2450" cy="910" r="80" fill="none" stroke="#9ca3af" stroke-width="3"/>
          <line x1="2380" y1="910" x2="2520" y2="910" stroke="#d1d5db" stroke-width="4"/>
          <line x1="2450" y1="840" x2="2450" y2="980" stroke="#d1d5db" stroke-width="4"/>

        </svg>
      `;
    }

    function renderSlots(positions) {
      let html = '';

      const slotTypes = [
        { key: 'fabric', label: 'Fabric' },
        { key: 'frame', label: 'Frame' },
        { key: 'component', label: 'Component' },
        { key: 'drive', label: 'Drive' }
      ];

      for (const { key, label } of slotTypes) {
        for (const pos of positions[key]) {
          html += `
            <div class="tile-slot ${key}" style="left: ${pos.x}px; top: ${pos.y}px;">
              <span class="slot-placeholder">${label}</span>
            </div>
          `;
        }
      }

      return html;
    }

    function renderBoard(faction, age) {
      const data = FACTION_DATA[faction];
      const slots = getSlotCounts(faction, age);
      const positions = getSlotPositions(age, slots);
      const board = document.getElementById('board');
      board.className = `player-board ${faction}`;

      board.innerHTML = `
        <!-- Faction Header -->
        <div class="faction-header">
          <div class="faction-flag">${ICONS[faction]}</div>
          <div class="faction-info">
            <div class="faction-name">${data.name}</div>
            <div class="faction-ability">${data.ability}</div>
          </div>
          <div class="age-badge age-${age}">Age ${['I','II','III'][age-1]}: ${AGE_NAMES[age]}</div>
        </div>

        <!-- Blueprint with Airship Shape -->
        <div class="blueprint-section">
          <div class="blueprint-title">Blueprint</div>
          <div class="airship-layout">
            ${renderAirshipOutline()}
            ${renderSlots(positions)}
          </div>
        </div>

        <!-- Ship Stats -->
        <div class="stats-section">
          <div class="stats-title">Ship Stats</div>
          <div class="stat-table">
            <div class="stat-row speed">
              <div class="stat-icon">${ICONS.speed}</div>
              <div class="stat-name">Speed</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">min 1</span>
            </div>
            <div class="stat-row range">
              <div class="stat-icon">${ICONS.range}</div>
              <div class="stat-name">Range</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">min 1</span>
            </div>
            <div class="stat-row ceiling">
              <div class="stat-icon">${ICONS.ceiling}</div>
              <div class="stat-name">Ceiling</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">route req</span>
            </div>
            <div class="stat-row reliability">
              <div class="stat-icon">${ICONS.reliability}</div>
              <div class="stat-name">Reliability</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">hazard</span>
            </div>
            <div class="stat-row luxury">
              <div class="stat-icon">${ICONS.luxury}</div>
              <div class="stat-name">Luxury</div>
              <div class="stat-cubes">
                ${[1,2,3,4,5].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">Age III</span>
            </div>
            <div class="stat-row armor">
              <div class="stat-icon">${ICONS.armor}</div>
              <div class="stat-name">Armor</div>
              <div class="stat-cubes">
                ${[1,2,3,4].map(n => `<div class="cube-slot">${n}</div>`).join('')}
              </div>
              <span class="stat-note">flak</span>
            </div>
          </div>
        </div>
      `;
    }

    window.renderBoard = renderBoard;
  </script>
</body>
</html>
