<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP SHIP! Helium Market</title>
  <style>
    :root {
      /* Palette - The "Aged Industrial" Look */
      --board-bg: #b9b19d; /* Brown/Tan box color */
      --page-bg: #ffffff;  /* White page */
      --text-dark: #2d3436;
      --board-border: #4a4036;
      --helium-light: #d1e9ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      width: 2550px;
      height: 3300px;
      margin: 0;
      padding: 0;
      background-color: var(--page-bg);
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The actual board component (The "Brown Box") */
    .market-board {
      background-color: var(--board-bg);
      border: 20px solid var(--board-border);
      border-radius: 12px;
      padding: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      max-width: 2400px; /* Ensure fit with margins */
    }

    /* Decorative inner border */
    .market-board-inner {
      border: 4px double rgba(0,0,0,0.15);
      padding: 40px;
      border-radius: 8px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .board-header {
      text-align: center;
      border-bottom: 4px solid var(--board-border);
      padding-bottom: 30px;
      margin-bottom: 40px;
      width: 100%;
    }

    .board-title {
      font-size: 96px;
      font-weight: 900;
      color: var(--text-dark);
      letter-spacing: 12px;
      text-transform: uppercase;
      font-family: 'Impact', 'Arial Black', sans-serif;
      white-space: nowrap;
    }

    /* Helium Market Grid */
    .helium-grid {
      display: flex;
      flex-direction: row;
      gap: 30px;
    }

    .helium-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      border-radius: 6px;
      min-width: 220px;
      background: white;
      border: 3px solid var(--board-border);
    }

    .helium-column.shaded {
      background: var(--helium-light);
    }

    .helium-price {
      font-size: 64px;
      font-weight: 900;
      color: var(--text-dark);
      margin-bottom: 30px;
    }

    .helium-slots {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .helium-slot {
      width: 142px; /* 12mm slot for 10mm cube */
      height: 142px;
      border: 4px solid var(--board-border);
      border-radius: 6px;
      background: white;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="market-board">
    <div class="market-board-inner">
      <!-- Header -->
      <div class="board-header">
        <h1 class="board-title">HELIUM MARKET</h1>
      </div>

      <!-- Helium Market - horizontal single row -->
      <div class="helium-grid">
        <div class="helium-column">
          <span class="helium-price">£1</span>
          <div class="helium-slots">
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
          </div>
        </div>
        <div class="helium-column">
          <span class="helium-price">£2</span>
          <div class="helium-slots">
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
          </div>
        </div>
        <div class="helium-column shaded">
          <span class="helium-price">£3</span>
          <div class="helium-slots">
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
          </div>
        </div>
        <div class="helium-column shaded">
          <span class="helium-price">£4</span>
          <div class="helium-slots">
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
          </div>
        </div>
        <div class="helium-column shaded">
          <span class="helium-price">£5</span>
          <div class="helium-slots">
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
          </div>
        </div>
        <div class="helium-column shaded">
          <span class="helium-price">£6</span>
          <div class="helium-slots">
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
            <div class="helium-slot"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
