<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hazard Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 750px;
      height: 1050px;
      margin: 0;
      padding: 0;
      background: white;
    }

    .hazard-card {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 750px;
      height: 1050px;
      background: linear-gradient(135deg, #2a2520, #1a1815);
      border: 8px solid var(--hazard-color, #888);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .hazard-card.auto-pass {
      background: linear-gradient(135deg, #1a2a1a, #152015);
    }

    /* Header section */
    .card-header {
      display: flex;
      align-items: center;
      padding: 24px 32px;
      gap: 24px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 4px solid var(--hazard-color);
    }

    .category-badge {
      font-size: 2.2rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 8px 24px;
      background: var(--hazard-color);
      color: #1a1815;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .card-name {
      flex: 1;
      font-size: 2.6rem;
      font-weight: 600;
      color: #e8e4d9;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* Image area */
    .card-image-area {
      flex: 1;
      min-height: 400px;
      background: rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Footer section */
    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px 32px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 4px solid var(--hazard-color);
    }

    .auto-pass-text {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: #4caf50;
      font-size: 3rem;
      font-weight: 600;
    }

    .auto-pass-text svg {
      width: 64px;
      height: 64px;
    }

    .challenge-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .challenge-type {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #c4b8a0;
    }

    .challenge-type svg {
      width: 64px;
      height: 64px;
    }

    .challenge-label {
      font-size: 2.4rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .difficulty {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .difficulty-label {
      font-size: 2.2rem;
      text-transform: uppercase;
      color: #888;
    }

    .difficulty-value {
      font-size: 3.4rem;
      font-weight: 700;
      color: var(--hazard-color);
      min-width: 72px;
      text-align: center;
    }

    .engineer-cost {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px 32px;
      background: rgba(139, 90, 43, 0.3);
      border: 4px solid #8b5a2b;
      border-radius: 12px;
      color: #d4a574;
      font-size: 2.8rem;
      font-weight: 600;
    }

    .engineer-cost svg {
      width: 56px;
      height: 56px;
    }

    .flak-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 12px 32px;
      background: rgba(139, 0, 0, 0.3);
      border: 4px solid #8b0000;
      border-radius: 12px;
      color: #ff6b6b;
      font-size: 2.8rem;
      font-weight: 600;
    }

    .flak-label {
      text-transform: uppercase;
      font-size: 2.4rem;
      opacity: 0.9;
    }

    .flak-value {
      font-size: 3.4rem;
      font-weight: 700;
    }

    /* Hazard category colors */
    .hazard-clear { --hazard-color: #4caf50; }
    .hazard-minor { --hazard-color: #ffc107; }
    .hazard-major { --hazard-color: #ff9800; }
    .hazard-fire { --hazard-color: #f44336; }
    .hazard-mechanical { --hazard-color: #9e9e9e; }
  </style>
</head>
<body>
  <div id="card" class="hazard-card"></div>

  <script>
    // SVG Icons
    const ICONS = {
      launch: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 12h6v10l8-10h-6V2z" fill="currentColor"/>
      </svg>`,
      speed: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="currentColor"/>
        <path d="M12 4C6.48 4 2 8.48 2 14h2c0-4.42 3.58-8 8-8s8 3.58 8 8h2c0-5.52-4.48-10-10-10z" fill="currentColor"/>
        <path d="M12 8l-1.5 6h3L12 8z" fill="currentColor"/>
      </svg>`,
      range: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.14 2 5 5.14 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/>
      </svg>`,
      ceiling: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 18h2V6H7v12zm4-12v12h2V6h-2zm4 3v9h2V9h-2z" fill="currentColor"/>
        <path d="M3 21h18v2H3v-2z" fill="currentColor"/>
      </svg>`,
      reliability: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/>
      </svg>`,
      engineers: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 14c0-5.5 4.5-10 10-10s10 4.5 10 10v2H2v-2z" fill="#ffa726"/>
        <path d="M1 16h22v2H1z" fill="#f57c00"/>
        <path d="M12 4v10" fill="none" stroke="#fb8c00" stroke-width="1.5"/>
        <path d="M6.5 6.5c1.5 3 1.5 7.5 1.5 9.5" fill="none" stroke="#fb8c00" stroke-width="1.5"/>
        <path d="M17.5 6.5c-1.5 3-1.5 7.5-1.5 9.5" fill="none" stroke="#fb8c00" stroke-width="1.5"/>
      </svg>`
    };

    const CATEGORY_LABELS = {
      clear: 'Clear',
      minor: 'Minor',
      major: 'Major',
      fire: 'Fire',
      mechanical: 'Mechanical'
    };

    function renderCard(hazard, assetsPath) {
      const categoryClass = `hazard-${hazard.category}`;
      const isAutoPass = hazard.category === 'clear' || hazard.autoPass;

      // Image filename
      const imageFilename = `hazard_${hazard.name
        .toLowerCase()
        .replace(/['']/g, '')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_|_$/g, '')}`;

      let footerHtml = '';
      if (isAutoPass) {
        footerHtml = `
          <div class="auto-pass-text">
            ${ICONS.launch}
            <span>Safe Passage</span>
          </div>
        `;
      } else {
        let challengeHtml = '';
        if (hazard.challengeType) {
          const icon = ICONS[hazard.challengeType] || ICONS.reliability;
          challengeHtml = `
            <div class="challenge-type">
              ${icon}
              <span class="challenge-label">${hazard.challengeType}</span>
            </div>
          `;
        }

        let engineerHtml = '';
        if (hazard.engineerCost) {
          engineerHtml = `
            <div class="engineer-cost">
              ${ICONS.engineers}
              <span>Spend ${hazard.engineerCost} to save</span>
            </div>
          `;
        }

        let flakHtml = '';
        if (hazard.flak > 0) {
          flakHtml = `
            <div class="flak-indicator">
              <span class="flak-label">Flak</span>
              <span class="flak-value">${hazard.flak}</span>
            </div>
          `;
        }

        footerHtml = `
          <div class="challenge-info">
            ${challengeHtml}
            <div class="difficulty">
              <span class="difficulty-label">Diff</span>
              <span class="difficulty-value">${hazard.difficulty}</span>
            </div>
          </div>
          ${engineerHtml}
          ${flakHtml}
        `;
      }

      document.getElementById('card').className = `hazard-card ${categoryClass}${isAutoPass ? ' auto-pass' : ''}`;
      document.getElementById('card').innerHTML = `
        <div class="card-header">
          <span class="category-badge">${CATEGORY_LABELS[hazard.category] || hazard.category}</span>
          <span class="card-name">${hazard.name}</span>
        </div>
        <div class="card-image-area">
          <img src="${assetsPath}/cards/hazard/${imageFilename}.png"
               alt="${hazard.name}"
               class="card-image"
               onerror="this.style.display='none'">
        </div>
        <div class="card-footer">
          ${footerHtml}
        </div>
      `;
    }

    window.renderCard = renderCard;
  </script>
</body>
</html>
