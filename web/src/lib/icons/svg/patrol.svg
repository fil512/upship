<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- WWI Patrol/Lookout - Searchlight -->
  <!-- Base/mount -->
  <rect x="9" y="18" width="6" height="4" rx="1" fill="#4a4a4a"/>
  <rect x="7" y="20" width="10" height="2" rx="0.5" fill="#3a3a3a"/>
  <!-- Support arm -->
  <rect x="11" y="12" width="2" height="7" fill="#5a5a5a"/>
  <!-- Light housing -->
  <ellipse cx="12" cy="9" rx="6" ry="5" fill="#6a6a6a"/>
  <ellipse cx="12" cy="9" rx="5" ry="4" fill="#5a5a5a"/>
  <!-- Lens/reflector -->
  <ellipse cx="12" cy="8" rx="4" ry="3" fill="#f0e68c"/>
  <ellipse cx="12" cy="7.5" rx="3" ry="2" fill="#fffacd"/>
  <!-- Light beams -->
  <path d="M8 5 L6 2 L7 2.5 L8 5" fill="#f0e68c" opacity="0.6"/>
  <path d="M12 4 L12 1 L12.5 1.5 L12 4" fill="#f0e68c" opacity="0.6"/>
  <path d="M16 5 L18 2 L17 2.5 L16 5" fill="#f0e68c" opacity="0.6"/>
  <!-- Handle -->
  <rect x="17" y="8" width="3" height="1.5" rx="0.5" fill="#4a4a4a"/>
</svg>
