<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Gold Telescope - angled, wide end down -->
  <!-- Main tube - angled from top-left to bottom-right -->
  <path d="M6 4 L8 4 L18 18 L20 20 L17 21 L15 19 L5 5 Z" fill="#d4af37"/>
  <!-- Wide lens end (bottom-right) -->
  <ellipse cx="17.5" cy="19.5" rx="3.5" ry="2.5" fill="#c9a227" transform="rotate(45 17.5 19.5)"/>
  <ellipse cx="18" cy="20" rx="2" ry="1.3" fill="#87ceeb" opacity="0.7" transform="rotate(45 18 20)"/>
  <!-- Narrow eyepiece (top-left) -->
  <ellipse cx="6" cy="4" rx="1.5" ry="1" fill="#b8960c" transform="rotate(45 6 4)"/>
  <!-- Brass bands -->
  <rect x="9" y="8" width="2" height="1.2" rx="0.3" fill="#e5c158" transform="rotate(45 10 8.6)"/>
  <rect x="13" y="13" width="2" height="1.2" rx="0.3" fill="#e5c158" transform="rotate(45 14 13.6)"/>
  <!-- Highlight along tube -->
  <path d="M7 5 L14 12" stroke="#e8d48a" stroke-width="1" opacity="0.5"/>
</svg>
