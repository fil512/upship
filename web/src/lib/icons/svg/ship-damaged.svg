<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Ship: Damaged Zeppelin (with damage overlay) -->
  <!-- Full airship body - light gray so visible on dark backgrounds -->
  <ellipse cx="12" cy="10" rx="11" ry="6" fill="#9ca3af"/>
  <!-- Fins -->
  <path d="M2 10L0 8v4l2-2z" fill="#9ca3af"/>
  <path d="M22 10l2-2v4l-2-2z" fill="#9ca3af"/>
  <path d="M12 4L10 2h4l-2 2z" fill="#9ca3af"/>
  <!-- Gondola -->
  <rect x="8" y="15" width="8" height="3" rx="1" fill="#6b7280"/>
  <!-- Connections -->
  <line x1="10" y1="15" x2="10" y2="13" stroke="#6b7280" stroke-width="1"/>
  <line x1="14" y1="15" x2="14" y2="13" stroke="#6b7280" stroke-width="1"/>
  <!-- Damage marks (red cracks) -->
  <path d="M6 7L8 10L6 13" stroke="#dc2626" stroke-width="2" fill="none"/>
  <path d="M16 6L18 9L16 12" stroke="#dc2626" stroke-width="2" fill="none"/>
  <!-- Red X overlay to indicate damaged/needs repair -->
  <circle cx="18" cy="16" r="5" fill="#dc2626"/>
  <path d="M16 14l4 4M20 14l-4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
