<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- WWI Military Supply Crate - wooden with metal bands -->
  <!-- Main crate body -->
  <rect x="3" y="6" width="18" height="14" rx="1" fill="#8b7355"/>
  <!-- Wood grain lines -->
  <line x1="3" y1="10" x2="21" y2="10" stroke="#7a6245" stroke-width="0.5"/>
  <line x1="3" y1="14" x2="21" y2="14" stroke="#7a6245" stroke-width="0.5"/>
  <line x1="3" y1="18" x2="21" y2="18" stroke="#7a6245" stroke-width="0.5"/>
  <!-- Metal bands -->
  <rect x="2" y="8" width="20" height="1.5" fill="#5a5a5a"/>
  <rect x="2" y="16" width="20" height="1.5" fill="#5a5a5a"/>
  <!-- Center cross marking -->
  <line x1="8" y1="6" x2="8" y2="20" stroke="#9a8365" stroke-width="2"/>
  <line x1="16" y1="6" x2="16" y2="20" stroke="#9a8365" stroke-width="2"/>
  <!-- Top lid line -->
  <line x1="3" y1="6.5" x2="21" y2="6.5" stroke="#6a5335" stroke-width="1"/>
  <!-- Corner rivets -->
  <circle cx="4.5" cy="8.75" r="0.6" fill="#4a4a4a"/>
  <circle cx="19.5" cy="8.75" r="0.6" fill="#4a4a4a"/>
  <circle cx="4.5" cy="16.75" r="0.6" fill="#4a4a4a"/>
  <circle cx="19.5" cy="16.75" r="0.6" fill="#4a4a4a"/>
</svg>
